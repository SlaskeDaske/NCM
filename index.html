<html lang="da">

<title>Neck Cheese Man</title>
<style>
/* Layout: fuldskærms canvas-spil med HUD øverst, evneknapper nederst, dialog som tekstboks i bunden */
:root{
  --ink:#0d0a14; --night:#1a1326; --panel:#2a2040; --panel2:#3a2c55;
  --cheese:#f6c431; --cheese2:#d08a1a; --cape:#c8372d; --stink:#9bc53d; --cream:#fff4dc; --mute:#b9a9d6;
  --ui: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui);background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--ui);color:var(--cream);cursor:pointer;-webkit-tap-highlight-color:transparent}
.px{background:var(--panel2);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12)}
.px:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
.px:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}

#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 14px calc(env(safe-area-inset-left,0px) + 10px);
  background:linear-gradient(var(--ink) 55%,rgba(13,10,20,0));pointer-events:none}
#top button{pointer-events:auto;width:38px;height:38px;font-size:17px;font-weight:900;padding:0;display:grid;place-items:center}
#lvl{flex:1;min-width:0}
#lvlname{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--cheese);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--ink)}
#hearts{display:flex;gap:3px;margin-top:4px}
#hearts i{width:18px;height:16px;background-size:100% 100%;image-rendering:pixelated}
#goal{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);max-width:calc(100% - 24px);
  background:rgba(13,10,20,.82);border:2px solid var(--panel2);padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#goal b{color:var(--cheese)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(320px,calc(100% - 32px));pointer-events:none;text-align:center}
#bossbar span{font-size:11px;font-weight:900;letter-spacing:.12em;color:#ffb3a8;text-shadow:2px 2px 0 var(--ink)}
#bossbar div{height:10px;border:3px solid var(--ink);background:#3a1a14;margin-top:3px}
#bossbar i{display:block;height:100%;background:linear-gradient(#e0483e,#a3241c);width:100%;transition:width .15s}

#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 124px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--cream);color:var(--ink);border:3px solid var(--ink);padding:7px 11px;font-size:13px;font-weight:700;max-width:340px;box-shadow:4px 4px 0 rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast b{color:var(--cape)}
.toast.fb{background:#3b5998;color:#fff}.toast.fb b{color:#fff}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#abil{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding:16px calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 10px);
  background:linear-gradient(rgba(13,10,20,0),var(--ink) 45%)}
.ab{position:relative;width:70px;height:74px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.ab canvas{width:40px;height:40px;image-rendering:pixelated;border:2px solid var(--ink)}
.ab span{font-size:11.5px;font-weight:800;letter-spacing:.02em}
.ab .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(13,10,20,.72);pointer-events:none}
.ab.ready{background:#5a3f1a;animation:glow .8s steps(2) infinite}
@keyframes glow{50%{background:#8a5a1a}}
.ab.off{filter:grayscale(1) brightness(.7)}

#dialog{position:absolute;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 10px)}
#dbox{max-width:600px;margin:0 auto;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;background:var(--cream);color:var(--ink);border:4px solid var(--ink);padding:10px;box-shadow:0 0 0 3px var(--cheese),6px 8px 0 3px rgba(0,0,0,.5);min-height:96px}
#dp{width:84px;height:84px;image-rendering:pixelated;border:3px solid var(--ink)}
#dtext{min-width:0}
#dn{display:block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cape);margin-bottom:4px}
#dt{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;min-height:3.9em}
#dmore{display:block;text-align:right;font-size:12px;font-weight:900;color:var(--cheese2);animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

#scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px),
    radial-gradient(ellipse at 50% 30%,#2e2146,var(--night) 70%)}
#scr.dim{background:rgba(13,10,20,.84)}
.card{width:min(420px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.card h1{margin:0;font-weight:900;font-size:clamp(38px,11vw,58px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;color:var(--cheese);
  text-shadow:3px 3px 0 var(--cape),6px 6px 0 var(--ink);text-wrap:balance}
.card h2{margin:0;font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1;color:var(--cheese);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.card .sub{margin:-4px 0 0;font-size:16px;font-weight:800;color:var(--stink);letter-spacing:.02em}
.card .eyebrow{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.card p{margin:0;font-size:15px;line-height:1.45;max-width:34ch}
.bigp{width:min(170px,42vw);height:min(170px,42vw);image-rendering:pixelated;border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row canvas{width:64px;height:64px;image-rendering:pixelated;border:3px solid var(--ink)}
.btns{display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}
.btns button{font-size:18px;font-weight:900;padding:13px 16px;letter-spacing:.02em}
.btns button.main{background:var(--cape)}
.btns button.alt{background:var(--panel);font-size:15px}
.how{list-style:none;margin:0;padding:10px 12px;background:rgba(13,10,20,.55);border:2px solid var(--panel2);font-size:13px;line-height:1.6;text-align:left;width:min(300px,100%);box-sizing:border-box}
.how li::before{content:"▸ ";color:var(--cheese)}
.foot{font-size:12px!important;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:14px;background:rgba(13,10,20,.55);border:2px solid var(--panel2);padding:10px 14px;text-align:left}
.stats b{font-variant-numeric:tabular-nums;color:var(--cheese);text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="top" hidden>
    <div id="lvl"><div id="lvlname"></div><div id="hearts"></div></div>
    <button id="mute" class="px" aria-label="Lyd til/fra">♪</button>
    <button id="menu" class="px" aria-label="Menu">II</button>
  </div>
  <div id="goal" hidden></div>
  <div id="bossbar" hidden><span>THE GREAT RECALL TURD</span><div><i id="bosshp"></i></div></div>
  <div id="toasts"></div>
  <div id="abil" hidden></div>
  <div id="dialog" hidden>
    <div id="dbox"><canvas id="dp" width="32" height="32"></canvas><div id="dtext"><b id="dn"></b><p id="dt"></p><span id="dmore">▼ tryk</span></div></div>
  </div>
  <div id="scr"></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=Math.random, pick=a=>a[(rnd()*a.length)|0], clamp=(v,a,b)=>v<a?a:v>b?b:v;
const UIF='ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

/* ================= PIXEL ART ================= */
const PAL={k:'#1b1420',s:'#f2b48a',S:'#d98b62',n:'#e8743b',h:'#4a2c1a',H:'#7a4a2a',r:'#c8372d',R:'#8e2420',y:'#f6c431',Y:'#d08a1a',b:'#2a2735',B:'#45405a',w:'#ffffff',g:'#8a8f99',G:'#555a64',l:'#8fc0e6',L:'#5b8fc0',o:'#c8742a',O:'#8a4a1a',a:'#e0b070',c:'#b8bcc6',u:'#fff27a',U:'#ffd23a',f:'#d2582a',F:'#9a3a1a',m:'#3a2418',p:'#6aa84f',P:'#3f7a34',t:'#7a4a24',T:'#4e2c14',x:'#a8703a',j:'#34405e',d:'#d8b27a'};
const ROWS={
neck:["......kkkk......",".....kssssk.....","....kssssssk....","...hksksskskh...","..hhksnnnnskhh..","..hhkmmnnmmkhh..","...hkssmmssk....",".....kssk.......","..yyyyyyyyyyyy..",".ryyYyyyyyYyyyr.",".rrkyyYyyyyykrr.",".rrbbkyyyykbbrr.",".rrbbbbrrbbbbrr.","..rbbbbkkbbbbr..","...bbbb..bbbb...","...kkk....kkk..."],
egern:["..oo......oo....","..oOo....oOo....","..oooooooooo....","..oohhhhhhoo....","..ooskssksoo....","..oosssssso.OO..","..oohsshhoo.OOO.","...oohhhhoo.OoOO","..oooooooooo.oOO",".ooooaaooooooOO.",".sooaOaaooosOO..","..ooooaoooo.O...","..oOOOOOOOo.....","..oooo..oooo....","..oooo..oooo....","..OOO....OOO...."],
badboy:["....hhhhhh......","...hhHhhHhh.....","...hssssssh.....","...skssskss.....","...ssssSsss.....","...hsHHHHsh.....","....hhhhhh......",".....ssss.......","...llllllll.....","..llllLlllll....","..lsllLllllsa...","..lslllLllls....","...jjjjjjjj.....","...jjjj.jjj.....","...jjj..jjj.....","...kkk..kkk....."],
martin:["...u.u.u.u.u....","...UcUcUcUcU....","...ccccccccc....","...hhssssshh....","...hgkgsgkgh....","...hssssSssh....","...hhHssHhhh....","....hhHHHhh.....",".....hhhhh......","...jjjjjjjjj....","..jjjjkjjjjjj...","..sjjjjkjjjjs...","...jjjjjjjjj....","...GGGG.GGGG....","...GGG...GGG....","...kkk...kkk...."],
eivind:["................","....ffffff......","...fffFffff.....","..kfssssssfk....","..rsskssksr.....","..rssssSsssr....","..kfsswwssfk....","...fFFFFFFf.....","....ffffff......","...gggggggg.....","..ggggGgggggg...","..sgggGggggs....","...gggggggg.....","...jjjj.jjj.....","...jjj..jjj.....","...kkk..kkk....."],
turd:["................","................",".......tt.......","......tTxt......",".....tttttt.....","....tTTxTTTt....","...ttwkttwkttt..","...tTTTTTTTTt...","..ttxkkkkkkxtt..",".pTTTTTTTTTTTTp.","ppttttttttttttpp",".PTTTTTTTTTTTTP.","..pp........pp..","................","................","................"],
cheese:[".......kk",".....kkyk","...kkyyyk",".kkyyYyyk","kyyyyyyyk","kyYyyyYyk","kyyyyyyyk","kkkkkkkkk"],
};
ROWS.eivindA=ROWS.eivind.slice(); ROWS.eivindA[0]="dd.d......d.dd.."; ROWS.eivindA[1]=".dddffffffddd...";
ROWS.cheeseE=ROWS.cheese.map(r=>r.replace(/y/g,'B').replace(/Y/g,'b'));
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x);return c}
function fromRows(rows){const w=Math.max(...rows.map(r=>r.length));return mk(w,rows.length,x=>{rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=PAL[r[i]];if(c){x.fillStyle=c;x.fillRect(i,j,1,1)}}})})}
function whiteOf(img){return mk(img.width,img.height,x=>{x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,img.width,img.height)})}
const SPR={};for(const k in ROWS)SPR[k]=fromRows(ROWS[k]);
SPR.turdW=whiteOf(SPR.turd);
const memberSprite=id=>id==='eivind'?(G.flags.antlers?SPR.eivindA:SPR.eivind):SPR[id];

/* 32x32 portrætter, tegnet med chunky former */
const PCACHE={};
function portrait(id){
  const key=id+(id==='eivind'&&G.flags.antlers?'A':'');
  if(PCACHE[key])return PCACHE[key];
  const bg={boss:'#2b2216',moose:'#22301f',speaker:'#1e2433'}[id]||'#241a35';
  const c=mk(32,32,x=>{
    x.fillStyle=bg;x.fillRect(0,0,32,32);
    const r=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};
    const e=(cx,cy,rx,ry,c)=>{x.fillStyle=c;for(let yy=-ry;yy<=ry;yy++){const ww=Math.round(rx*Math.sqrt(Math.max(0,1-(yy*yy)/(ry*ry+.01))));x.fillRect(Math.round(cx-ww),Math.round(cy+yy),ww*2,1)}};
    const K='#1b1420',SK='#f2b48a';
    if(id==='neck'){
      r(1,22,30,10,'#c8372d');r(1,22,2,10,'#8e2420');r(29,22,2,10,'#8e2420');
      r(10,24,12,8,'#2a2735');r(14,24,4,8,'#8e2420');
      r(13,16,6,7,'#d98b62');
      e(16,23,13,4,K);e(16,23,12,3,'#f6c431');r(9,23,2,1,'#d08a1a');r(19,22,2,2,'#d08a1a');r(24,24,1,1,'#d08a1a');
      r(9,26,2,3,'#f6c431');r(20,26,2,4,'#f6c431');r(15,26,2,2,'#f6c431');
      e(16,10,8,10,K);e(16,10,7,9,SK);r(10,3,3,2,'#ffd2b0');
      e(8,13,3,4,'#4a2c1a');e(24,13,3,4,'#4a2c1a');e(7,9,2,2,'#5c3a22');e(25,9,2,2,'#5c3a22');
      r(11,8,4,4,'#fff');r(17,8,4,4,'#fff');r(13,9,2,2,'#000');r(18,9,2,2,'#000');
      r(10,6,5,1,'#3a2418');r(17,6,5,1,'#3a2418');
      e(16,14,3,4,'#b04a22');e(16,14,2,3,'#e8743b');r(15,12,1,2,'#ffb08a');
      e(16,18,6,2,'#3a2418');r(8,16,2,2,'#3a2418');r(22,16,2,2,'#3a2418');
      r(14,20,4,1,'#8e2420');
    } else if(id==='egern'){
      e(27,18,5,11,'#8a4a1a');e(27,18,4,10,'#c8742a');r(26,12,2,10,'#e0b070');
      r(4,24,22,8,'#c8742a');r(4,24,22,1,'#8a4a1a');
      e(15,28,3,3,'#e0b070');r(12,25,7,2,'#8a4a1a');
      e(15,13,10,11,'#8a4a1a');e(15,13,9,10,'#c8742a');
      r(6,0,4,6,'#8a4a1a');r(7,1,2,5,'#c8742a');r(21,0,4,6,'#8a4a1a');r(22,1,2,5,'#c8742a');r(7,3,1,2,'#e0b070');r(22,3,1,2,'#e0b070');
      e(15,15,6,7,SK);r(9,8,12,3,'#7a4a2a');r(11,7,3,2,'#7a4a2a');
      r(11,13,3,2,'#fff');r(17,13,3,2,'#fff');r(12,13,2,2,K);r(18,13,2,2,K);
      r(10,11,4,1,'#4a2c1a');r(17,10,4,1,'#4a2c1a');
      r(14,15,2,2,'#d98b62');
      e(15,20,5,2,'#7a4a2a');r(13,18,5,1,'#8e2420');r(17,17,1,1,'#8e2420');
    } else if(id==='badboy'){
      r(3,23,26,9,'#8fc0e6');r(12,23,8,3,'#5b8fc0');r(15,25,2,7,'#5b8fc0');
      r(13,18,6,6,'#d98b62');
      e(16,13,8,9,K);e(16,13,7,8,SK);
      e(16,6,8,4,'#7a4a2a');r(10,2,3,4,'#7a4a2a');r(15,1,3,4,'#7a4a2a');r(20,2,3,4,'#7a4a2a');r(9,7,2,5,'#7a4a2a');r(21,7,2,5,'#7a4a2a');

      r(11,12,3,2,'#fff');r(18,12,3,2,'#fff');r(12,12,2,2,K);r(19,12,2,2,K);r(15,14,2,2,'#d98b62');
      r(12,18,8,3,K);r(13,18,6,2,'#fff');
      r(6,9,3,9,K);r(7,11,1,5,'#c8372d');r(23,9,3,9,K);r(24,11,1,5,'#c8372d');r(8,6,16,2,K);

function mkMember(id,x,y){return {id,x,y,flip:false,bubble:null,hop:null}}
function mkTurd(x,y,type,hp){return {type,x:x+.5,y:y+.5,hp,maxhp:hp,r:.45,moving:false,tx:0,ty:0,wait:rnd()*1.5,stun:0,flash:0,shootT:1.5+rnd()*2,flip:rnd()<.5,dead:false,spd:1}}
function mkBoss(x,y){return {boss:true,type:'boss',x:x+.5,y:y+.5,hp:36,maxhp:36,r:1,stun:0,flash:0,shootT:2,flip:false,dead:false,summons:[.7,.35],bubble:null}}
function say(e,text,t=2.8){if(e)e.bubble={text,t}}
const member=id=>G.party.find(m=>m.id===id);

function loadLevel(i){
  const L=LEVELS[i];G.lv=i;G.def=L;G.H=L.map.length;G.W=L.map[0].length;
  G.grid=L.map.map(r=>r.split(''));
  G.foes=[];G.shots=[];G.parts=[];G.pops=[];G.evs=[];G.npc=null;G.boss=null;G.seen={};
  G.flags={antlers:i>=4,keycard:false,bridge:false};G.doorOpen=false;G.bossStarted=false;G.bossActive=false;
  let sx=1,sy=1;
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){
    const ch=G.grid[y][x];
    if(ch==='@'){sx=x;sy=y;G.grid[y][x]='.'}
    else if(ch==='N'){G.npc={id:L.npc,x:x+.5,y:y+.5,gx:x,gy:y,bubble:null,greeted:false,flip:false};G.grid[y][x]='.'}
    else if(ch==='T'){G.foes.push(mkTurd(x,y,pick(L.turds),L.thp));G.grid[y][x]='.'}
    else if(ch==='x'){G.boss=mkBoss(x,y);G.foes.push(G.boss);G.grid[y][x]='.'}
  }
  G.start={x:sx+.5,y:sy+.5};
  G.player={id:'neck',x:sx+.5,y:sy+.5,path:null,onArrive:null,target:null,flip:false,moving:false,swing:null,bubble:null,repath:0};
  G.party=[];const ids=[];if(i>=1)ids.push('egern');if(i>=3)ids.push('martin');if(i>=4)ids.push('eivind');
  ids.forEach(id=>G.party.push(mkMember(id,sx+.5,sy+.5)));
  G.trail=[{x:sx+.5,y:sy+.5}];
  G.hp=G.maxhp;G.inv=0;G.cd={puff:0,acorn:0,flash:0};G.fbT=has('eivind')?25:0;
  G.leakTotal=leaks();
  for(const k in PCACHE)if(k.startsWith('eivind'))delete PCACHE[k];
  paintLevel();
  $('#lvlname').textContent=`${i+1}/5 · ${L.name}`;
  $('#bossbar').hidden=true;
  buildAbil();renderHearts();lastGoal='';
  const p=G.player;G.cam.x=p.x*16-VW/2;G.cam.y=p.y*16-VH/2;
}

/* ================= PATHFINDING ================= */
function bfs(sx,sy,goal){
  const W=G.W,H=G.H,prev=new Int32Array(W*H).fill(-1),q=new Int32Array(W*H);let qh=0,qt=0;
  const s=sy*W+sx;prev[s]=s;q[qt++]=s;
  while(qh<qt){
    const c=q[qh++],cx=c%W,cy=(c/W)|0;
    if(goal(cx,cy)){const path=[];let n=c;while(n!==s){path.push([n%W,(n/W)|0]);n=prev[n]}return path.reverse()}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(prev[n]>=0||!walk(nx,ny))continue;prev[n]=c;q[qt++]=n}
  }
  return null;
}
const ptile=()=>[Math.floor(G.player.x),Math.floor(G.player.y)];
function goTo(gx,gy,cb){const [sx,sy]=ptile();const p=bfs(sx,sy,(x,y)=>x===gx&&y===gy);if(!p){noPath();return false}setPath(p,cb);return true}
function goNear(gx,gy,cb){const [sx,sy]=ptile();const p=bfs(sx,sy,(x,y)=>Math.abs(x-gx)+Math.abs(y-gy)===1);if(!p){noPath();return false}setPath(p,cb);return true}
function setPath(p,cb){const pl=G.player;pl.path=p;pl.onArrive=cb||null;pl.target=null}
function noPath(){say(G.player,cnt('1')||cnt('2')?'Der kan jeg ikke gå hen. Måske med en krog?':'Der kan jeg ikke komme hen.',2)}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  if(G.state==='dialog'&&DLG.q){sfx.tick();if(DLG.shown<DLG.full.length)DLG.shown=DLG.full.length;else nextLine();return}
  if(G.state!=='play')return;
  const wx=(e.clientX*DPR/P+G.cam.x)/16,wy=(e.clientY*DPR/P+G.cam.y)/16;
  onTap(wx,wy);
},{passive:false});
function onTap(wx,wy){
  const pl=G.player;if(pl.swing)return;
  const gx=Math.floor(wx),gy=Math.floor(wy);
  G.tap={x:gx,y:gy,t:.5};
  let best=null,bd=1;
  for(const f of G.foes){if(f.dead)continue;const d=Math.hypot(f.x-wx,f.y-.3-wy)-(f.boss?.8:0);if(d<bd){bd=d;best=f}}
  if(best){pl.target=best;pl.path=null;pl.onArrive=null;pl.repath=0;return}
  if(G.npc&&Math.hypot(G.npc.x-wx,G.npc.y-.3-wy)<.9){goNear(G.npc.gx,G.npc.gy,talkNpc);return}
  const ch=cell(gx,gy);
  if(ch==='1'||ch==='2'){goTo(gx,gy,()=>swing(gx,gy));return}
  if(INTER.has(ch)){goNear(gx,gy,()=>interact(gx,gy));return}
  if(walk(gx,gy)){goTo(gx,gy);return}
}

/* ================= INTERAKTIONER ================= */
function interact(gx,gy){
  const ch=cell(gx,gy),pl=G.player;
  pl.flip=gx+.5<pl.x;
  switch(ch){
    case 'L':
      G.grid[gy][gx]='l';paintLevel();sfx.seal();burst(gx+.5,gy+.5,'#f6c431',14);say(pl,pick(SEAL));
      if(G.def.heal&&G.hp<G.maxhp){G.hp++;renderHearts();popText(pl.x,pl.y-1,'+1 friskhed','#9bc53d')}
      break;
    case 'l':say(pl,'Den er tætnet. Med ost. Kvalitet.');break;
    case 'S':{
      const eg=member('egern');
      if(eg){hop(eg,gx+.5,gy+.2,()=>{G.grid[gy][gx]='s';paintLevel();G.flags.keycard=true;sfx.squeak();burst(gx+.5,gy,'#fff27a',10);say(eg,'Squeak! Nøglekort fundet. Og en halvspist nød. Den er min.');toast('Nøglekort fundet!')})}
      else say(pl,'Den hylde er alt for høj. Jeg kender måske en, der kan klatre?');
      break;}
    case 's':say(pl,pick(['Samples. Ingen af dem er godkendt.','Hylde med telte. Én af dem drypper vist.','Lagerhylde. Den har set ting.']));break;
    case 'B':say(pl,pick(['Kasser med samples. Mærket: “HASTER!!!” fra 2022.','Der står SAMPLE på. Alt her står der SAMPLE på.']));break;
    case 'm':say(pl,pick(['En symaskine. Den syer stadig, helt af sig selv.','Her blev Turtle Turd-designet syet. Fra sidste møde. Hvem godkendte det?']));break;
    case 'k':say(pl,pick(['Et bord med en kold kop kaffe og et Excel-ark.','Mødebord. Der står “Glem Illustrator, glem Excel” på en post-it.']));break;
    case 'r':say(pl,pick(['En Perfion-server. Den lyser bekymret.','Serveren summer. Den har det ikke godt.','På skærmen står der bare 💩💩💩.']));break;
    case 'P':{
      const mt=member('martin');
      if(G.flags.bridge){say(pl,'Printeren hviler sig.');break}
      if(!mt){say(pl,'En 3D-printer. Jeg aner ikke, hvordan den virker. Ham med lyshjelmen ved det sikkert.');break}
      say(mt,'Printer bro… 4%… 37%… 100%!',2.5);sfx.print();
      const bs=[];for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.grid[y][x]==='b')bs.push([x,y]);
      bs.forEach(([x,y],k)=>G.evs.push({t:.5+k*.45,fn:()=>{G.grid[y][x]='=';paintLevel();sfx.print();burst(x+.5,y+.5,'#e98a3c',10)}}));
      G.evs.push({t:.7+bs.length*.45,fn:()=>{G.flags.bridge=true;say(mt,'Lavet af genbrugsplast og dårlige produktidéer.');toast('Broen er printet!')}});
      break;}
    case 'C':{
      const ev=member('eivind');
      if(!ev)say(pl,'En kæmpe kasse. Den rokker sig ikke.');
      else if(!G.flags.antlers)say(ev,'Jeg er ikke sterk nok uten gevir. Fisk, takk!');
      else hop(ev,gx+.5,gy+.5,()=>{G.grid[gy][gx]='.';paintLevel();sfx.crash();G.shake=.35;burst(gx+.5,gy+.5,'#8a5a2a',22);say(ev,'HA! Den kassa var ikke laget i Norge.')});
      break;}
    case 'F':{
      const ev=member('eivind');
      if(!ev){say(pl,'En spand rådden fisk. Lugten er… faktisk ret hyggelig?');break}
      if(G.flags.antlers){say(ev,'Jeg er mett. Takk.');break}
      G.grid[gy][gx]='.';paintLevel();
      dialog([['eivind','Rakfisk! Akkurat som hjemme. *gomle gomle*'],()=>{G.flags.antlers=true;for(const k in PCACHE)if(k.startsWith('eivind'))delete PCACHE[k];buildAbil();burst(ev.x,ev.y-1,'#d8b27a',16);sfx.pling()},['eivind','Kjenner du det? Geviret vokser! Nå kan jeg velte hva som helst.'],['neck','Det der er det mærkeligste, jeg har set i dag. Og jeg har en ost om halsen.']]);
      break;}
    case 'M':{
      const ev=member('eivind');
      if(!ev){say(pl,'En elg. Indenfor. På lageret. Den kigger dømmende på mig.');sfx.moo();break}
      dialog([['eivind','Mmmøøøh? Mø-mø-møøøh.'],()=>sfx.moo(),['moose','MØØØØØH.'],['eivind','Han flytter seg hvis vi lover å lukke døra etter oss.'],['neck','Det lover vi.']],()=>{G.grid[gy][gx]='.';paintLevel();burst(gx+.5,gy+.5,'#6b4226',18);toast('Elgen gik sin vej')});
      break;}
    case 'D':say(pl,'Låst. '+(G.def.doorHint?G.def.doorHint():''));break;
    case 'w':say(pl,pick(['Ost flyder ikke. Det har jeg testet.','Alt for vådt. Selv for et vandtæt telt.']));break;
    case 'b':say(pl,has('martin')?'Hvis bare nogen kunne printe en bro… (printeren til højre)':'Her mangler en bro. Og det lyser derovre i hjørnet…');break;
    case 'h':say(pl,'Et hul i gulvet. Tryk på de gule kroge for at svinge over.');break;
  }
}
function hop(m,tx,ty,mid){m.hop={x0:m.x,y0:m.y,tx,ty,t:0,dur:.8,mid,done:false}}
function talkNpc(){
  const n=G.npc;if(!n)return;G.player.flip=n.x<G.player.x;n.flip=!G.player.flip;
  dialog(G.def.npcLines,()=>{if(G.npc&&G.npc.id!=='badboy')join(G.npc.id);toast(G.def.joinMsg,4200)});
}
function transformBadboy(){
  const n=G.npc;burst(n.x,n.y-.5,'#c8742a',26);burst(n.x,n.y-.5,'#fff',10);sfx.squeak();
  G.party.push(mkMember('egern',n.x,n.y));G.npc=null;buildAbil();

function join(id){
  const n=G.npc;G.party.push(mkMember(id,n.x,n.y));G.npc=null;sfx.pling();burst(n.x,n.y-.5,'#fff27a',14);buildAbil();

function swing(gx,gy){
  const ch=cell(gx,gy);let to=null;
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.grid[y][x]===ch&&(x!==gx||y!==gy))to=[x,y];
  if(!to)return;
  const pl=G.player;pl.swing={x0:pl.x,y0:pl.y,x1:to[0]+.5,y1:to[1]+.5,t:0,dur:.75};sfx.swing();

/* ================= KAMP ================= */
function puff(){
  if(G.cd.puff>0)return;G.cd.puff=.85;G.stats.puffs++;sfx.fart();
  const pl=G.player;
  for(let i=0;i<18;i++){const a=rnd()*Math.PI*2,s=1.5+rnd()*2.5;G.parts.push({x:pl.x,y:pl.y-.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s*.8,life:.7,max:.7,col:pick(['#b9d65a','#9bc53d','#e6d36a','#c8b84a']),sz:3+rnd()*3,cloud:true})}
  let hit=false;
  for(const f of G.foes){if(f.dead)continue;if(f.boss&&!G.bossActive)continue;if(Math.hypot(f.x-pl.x,f.y-pl.y)<1.9+(f.boss?.7:0)){hurtFoe(f,1);hit=true}}
  if(!hit&&rnd()<.25)say(pl,pick(['Aroma-pust!','Pfffft.','Lugter som sejr.']),1.2);
}
function acorn(){
  const eg=member('egern');if(!eg||G.cd.acorn>0)return;
  const t=nearestFoe(eg,6.5);if(!t){toast('Ingen turds inden for rækkevidde',1400);return}
  G.cd.acorn=.6;sfx.squeak();if(rnd()<.3)say(eg,'Squeak!',1);
  const a=Math.atan2(t.y-eg.y,t.x-eg.x);G.shots.push({kind:'acorn',x:eg.x,y:eg.y-.5,vx:Math.cos(a)*9,vy:Math.sin(a)*9,tgt:t,life:1.5});

function rage(){
  const ev=member('eivind');if(!ev||G.rage<100||ev.stunT>0)return;
  G.rage=0;G.shake=.6;sfx.crash();sfx.boss();say(ev,'WINNER WINNER, RAKFISK DINNER!',2.2);

  for(const f of G.foes){if(f.dead)continue;if(f.boss&&!G.bossActive)continue;if(Math.hypot(f.x-ev.x,f.y-ev.y)<3.8+(f.boss?.8:0))hurtFoe(f,f.boss?4:3)}
}
const ABIL={puff:{who:'neck',label:'Pust',fn:puff},acorn:{who:'egern',label:'Agern',fn:acorn},flash:{who:'martin',label:'Blitz',fn:flashAb},rage:{who:'eivind',label:'Raseri',fn:rage}};
function nearestFoe(from,maxd){let b=null,bd=maxd;for(const f of G.foes){if(f.dead||(f.boss&&!G.bossActive))continue;const d=Math.hypot(f.x-from.x,f.y-from.y);if(d<bd){bd=d;b=f}}return b}
function hurtFoe(f,n){
  f.hp-=n;f.flash=.15;f.stun=Math.max(f.stun,f.boss?.15:.45);sfx.hit();popText(f.x,f.y-1,'-'+n,'#ffb3a8');
  if(f.hp<=0){f.dead=true;G.stats.kills++;sfx.pop();burst(f.x,f.y-.3,'#7a4a24',16);burst(f.x,f.y-.3,'#9bc53d',8);popText(f.x,f.y-1.4,pick(['POF!','PLOP!','SPLAT!']),'#f6c431');
    if(has('eivind'))G.rage=Math.min(100,G.rage+22);
    if(f.boss)bossDown();}
}
function hurtPlayer(n){
  if(G.inv>0||G.state!=='play')return;
  G.hp-=n;G.inv=1.2;G.shake=.25;sfx.hurt();renderHearts();popText(G.player.x,G.player.y-1.3,'Uhh, stank!','#e0483e');
  if(G.hp<=0){G.stats.falls++;G.state='dead';showDead()}
}
function respawn(){
  const pl=G.player;pl.x=G.start.x;pl.y=G.start.y;pl.path=null;pl.target=null;pl.onArrive=null;pl.swing=null;
  G.trail=[{x:pl.x,y:pl.y}];G.party.forEach(m=>{m.x=pl.x;m.y=pl.y;m.hop=null});
  G.hp=G.maxhp;G.inv=2;G.shots=[];renderHearts();
  if(G.boss&&!G.boss.dead){G.boss.x=6.5;G.boss.y=11.5}
  G.foes.forEach(f=>{if(!f.dead&&!f.boss&&Math.hypot(f.x-pl.x,f.y-pl.y)<2.5)f.stun=2});
}

/* ================= OPDATERING ================= */
let lastGoal='';
function update(dt){
  G.time+=dt;
  for(const k in G.cd)G.cd[k]=Math.max(0,G.cd[k]-dt);

function foeStep(e){

  if(!opts.length){e.wait=.5;return}
  let n;
  if(e.chase){opts.sort((a,b)=>Math.hypot(a[0]+.5-pl.x,a[1]+.5-pl.y)-Math.hypot(b[0]+.5-pl.x,b[1]+.5-pl.y));n=opts[0];if(Math.hypot(n[0]+.5-pl.x,n[1]+.5-pl.y)>d&&rnd()<.6){e.wait=.4;return}}

  e.tx=n[0]+.5;e.ty=n[1]+.5;e.moving=true;e.spd=e.chase?1.85:1.1;if(e.tx!==e.x)e.flip=e.tx<e.x;

function updFx(dt){

/* ================= RENDER ================= */
function camera(dt){
  const p=G.player,viewH=VH-G.hudT-G.hudB;
  let cx=p.x*16-VW/2,cy=p.y*16-(G.hudT+viewH/2);
  const mw=G.W*16,mh=G.H*16;
  cx=mw<=VW?(mw-VW)/2:clamp(cx,-6,mw-VW+6);
  cy=mh<=viewH?(mh-viewH)/2-G.hudT:clamp(cy,-G.hudT-6,mh-VH+G.hudB+6);
  const a=Math.min(1,dt*7);G.cam.x+=(cx-G.cam.x)*a;G.cam.y+=(cy-G.cam.y)*a;
}
function drawSpr(img,x,y,flip,lift=0,yoff=0,w,h){

  const dx=Math.round(x*16-w/2),dy=Math.round(y*16+6-h-lift*16+yoff);
  if(flip){ctx.save();ctx.translate(dx+w,dy);ctx.scale(-1,1);ctx.drawImage(img,0,0,w,h);ctx.restore()}else ctx.drawImage(img,dx,dy,w,h);
}
function shadow(x,y,w=10){ctx.fillStyle='rgba(0,0,0,.32)';const X=Math.round(x*16),Y=Math.round(y*16+5);ctx.fillRect(X-w/2,Y-1,w,2);ctx.fillRect(X-w/2+2,Y-2,w-4,4)}

  if(((t*2+f.x)|0)%3===0){ctx.fillStyle='rgba(155,197,61,.7)';ctx.fillRect(Math.round(f.x*16)-3,Math.round(f.y*16)-13-((t*6)|0)%3,1,3)}
}
function drawBoss(b,t){
  const wob=G.bossActive?((t*4|0)%2):((t*2|0)%2);
  drawSpr(b.flash>0?SPR.turdW:SPR.turd,b.x,b.y,b.flip,0,6-wob,32,32);
  const X=Math.round(b.x*16),Y=Math.round(b.y*16+12-32-wob+6);
  ctx.fillStyle='#f6c431';ctx.fillRect(X-6,Y-1,13,4);ctx.fillRect(X-6,Y-4,2,3);ctx.fillRect(X,Y-5,2,4);ctx.fillRect(X+5,Y-4,2,3);
  ctx.fillStyle='#c8372d';ctx.fillRect(X-3,Y,2,2);ctx.fillStyle='#5b8fc0';ctx.fillRect(X+3,Y,2,2);
  ctx.fillStyle='#c8372d';ctx.fillRect(X-12,Y+20,24,3);
  if(b.stun>0){const a=t*6;ctx.fillStyle='#fff27a';for(let i=0;i<3;i++)ctx.fillRect(Math.round(X+Math.cos(a+i*2)*10),Math.round(Y-6+Math.sin(a+i*2)*3),2,2)}
  for(let i=0;i<3;i++){ctx.fillStyle='rgba(155,197,61,.6)';ctx.fillRect(X-12+i*12,Y-8-((t*5+i)|0)%4,1,4)}
}
function tileAnims(cx,cy){
  const x0=Math.max(0,Math.floor(cx/16)),y0=Math.max(0,Math.floor(cy/16)),x1=Math.min(G.W-1,Math.ceil((cx+VW)/16)),y1=Math.min(G.H-1,Math.ceil((cy+VH)/16));
  const t=G.time;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const ch=G.grid[y][x],X=x*16,Y=y*16,r=(a,b,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(X+a,Y+b,w,h)};
    switch(ch){
      case 'L':r(5,10+((t*6+x)|0)%5,1,1,'#7fc3ff');r(11,8+((t*5+y)|0)%6,1,1,'#7fc3ff');break;
      case 'S':if(((t*3)|0)%2)r(13,0,1,1,'#fff');break;
      case '1':case '2':{const a=.55+.45*Math.sin(t*5);ctx.globalAlpha=a;r(5,2,6,1,'#f6c431');r(4,3,1,4,'#f6c431');r(11,3,1,4,'#f6c431');r(7,6,2,6,'#f6c431');r(5,11,6,1,'#d08a1a');ctx.globalAlpha=1;break}
      case 'F':r(5+((t*4|0)%2),-3-((t*4)|0)%3,1,2,'#9bc53d');r(10-((t*4|0)%2),-4-((t*4+1)|0)%3,1,2,'#9bc53d');break;
      case 'r':for(const yy of [2,5,8,11]){const on=hash(x*3+yy,(t*2|0)+y)<.6;r(11,yy,1,1,on?'#7CFC00':'#1f2636');r(9,yy+1,1,1,hash(x+yy,(t*3|0))<.4?'#5bc0ff':'#1f2636')}break;
      case 'E':{const b=((t*3)|0)%2;r(7,3+b,2,4,'#9bc53d');r(5,5+b,6,1,'#9bc53d');r(6,6+b,4,1,'#9bc53d');break}
      case 'w':case 'b':if(hash(x,y+((t*2)|0))<.25)r((hash(y,x)*13)|0,(hash(x+3,y)*13)|0,2,1,'#bfe4ff');break;
      case 'D':if(((t*2)|0)%2)r(7,2,2,1,'#ff8a80');break;
      case 'P':if(((t*4)|0)%2)r(12,13,1,1,'#7CFC00');break;
    }
  }
}
function darkness(cx,cy,t){
  const d=dctx;d.setTransform(1,0,0,1,0,0);d.globalCompositeOperation='source-over';d.clearRect(0,0,DK.width,DK.height);
  d.fillStyle='rgba(6,5,12,.94)';d.fillRect(0,0,DK.width,DK.height);
  d.globalCompositeOperation='destination-out';
  const hole=(x,y,R)=>{const X=(x*16-cx)*P,Y=(y*16-cy)*P,RR=R*16*P;const g=d.createRadialGradient(X,Y,RR*.15,X,Y,RR);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.6,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=g;d.fillRect(X-RR,Y-RR,RR*2,RR*2)};
  const mt=member('martin');if(mt)hole(mt.x,mt.y-.8,4.6+Math.sin(t*9)*.08);
  hole(G.player.x,G.player.y-.4,1.5);
  if(G.npc)hole(G.npc.x,G.npc.y-.5,1.6);
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.grid[y][x]==='E')hole(x+.5,y+.5,1.2);
  for(const f of G.foes)if(!f.dead)hole(f.x,f.y-.3,.55);
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(DK,0,0);
}
function bubble(e,h,cx,cy){
  const b=e.bubble;ctx.font=`700 6px ${UIF}`;ctx.textAlign='left';
  const words=b.text.split(' '),lines=[];let cur='';
  for(const w of words){const tt=cur?cur+' '+w:w;if(ctx.measureText(tt).width>78&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur);
  const w=Math.ceil(Math.max(...lines.map(l=>ctx.measureText(l).width)))+8,hh=lines.length*7+5;
  let bx=Math.round(e.x*16-w/2),by=Math.round(e.y*16+6-h-hh-6-(e.lift||0)*16);
  bx=clamp(bx,cx+3,cx+VW-w-3);by=Math.max(by,cy+G.hudT+2);
  ctx.globalAlpha=Math.min(1,b.t*3);
  ctx.fillStyle='#0d0a14';ctx.fillRect(bx-1,by-1,w+2,hh+2);ctx.fillStyle='#fff4dc';ctx.fillRect(bx,by,w,hh);
  const tx=clamp(Math.round(e.x*16),bx+3,bx+w-5);ctx.fillStyle='#0d0a14';ctx.fillRect(tx-1,by+hh,4,2);ctx.fillRect(tx,by+hh+2,2,2);ctx.fillStyle='#fff4dc';ctx.fillRect(tx,by+hh,2,2);
  ctx.fillStyle='#0d0a14';lines.forEach((l,i)=>ctx.fillText(l,bx+4,by+8+i*7-1.5));
  ctx.globalAlpha=1;
}

/* ================= UI ================= */
const heartURL={full:SPR.cheese.toDataURL(),empty:SPR.cheeseE.toDataURL()};
function renderHearts(){$('#hearts').innerHTML=Array.from({length:G.maxhp},(_,i)=>`<i style="background-image:url(${i<G.hp?heartURL.full:heartURL.empty})"></i>`).join('')}
function buildAbil(){
  const a=$('#abil');a.innerHTML='';
  const ids=['puff'];if(has('egern'))ids.push('acorn');if(has('martin'))ids.push('flash');if(has('eivind'))ids.push('rage');
  for(const id of ids){const A=ABIL[id];const b=document.createElement('button');b.className='ab px';b.dataset.a=id;b.setAttribute('aria-label',A.label);
    b.innerHTML=`<canvas width="32" height="32"></canvas><span>${A.label}</span><i class="cd"></i>`;
    b.querySelector('canvas').getContext('2d').drawImage(portrait(A.who),0,0);
    b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audio();if(G.state==='play')A.fn()});
    a.appendChild(b)}
  requestAnimationFrame(measureHud);
}
const CDMAX={puff:.85,acorn:.6,flash:9};
function updAbilUI(){
  for(const b of $('#abil').children){const id=b.dataset.a,cd=b.querySelector('.cd');
    if(id==='rage'){const ev=member('eivind');cd.style.height=(100-G.rage)+'%';b.classList.toggle('ready',G.rage>=100&&!(ev&&ev.stunT>0));b.classList.toggle('off',!!(ev&&ev.stunT>0))}
    else cd.style.height=(G.cd[id]/CDMAX[id]*100)+'%'}
}
function toast(html,ms=2600,cls=''){
  const t=document.createElement('div');t.className='toast '+cls;t.innerHTML=html;const box=$('#toasts');box.appendChild(t);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450)},ms);
}
/* dialog */
const DLG={q:null,i:0,done:null,shown:0,full:'',last:0};
function dialog(lines,done){
  DLG.q=lines;DLG.i=-1;DLG.done=done||null;G.state='dialog';
  $('#dialog').hidden=false;$('#abil').hidden=true;nextLine();
}
function nextLine(){
  DLG.i++;
  while(DLG.i<DLG.q.length&&typeof DLG.q[DLG.i]==='function'){DLG.q[DLG.i]();DLG.i++}
  if(DLG.i>=DLG.q.length){endDialog();return}
  const [who,text]=DLG.q[DLG.i];
  const c=$('#dp').getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,32,32);c.drawImage(portrait(who),0,0);
  $('#dn').textContent=NAMES[who]||who;DLG.full=text;DLG.shown=0;DLG.last=-1;$('#dt').textContent='';
}
function endDialog(){
  $('#dialog').hidden=true;$('#abil').hidden=false;G.state='play';const d=DLG.done;DLG.q=null;DLG.done=null;measureHud();if(d)d();
}
$('#dialog').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();audio();if(!DLG.q)return;sfx.tick();if(DLG.shown<DLG.full.length)DLG.shown=DLG.full.length;else nextLine()});
function updDialog(dt){if(G.state!=='dialog'||!DLG.q)return;DLG.shown=Math.min(DLG.full.length,DLG.shown+dt*48);const n=DLG.shown|0;if(n!==DLG.last){DLG.last=n;$('#dt').textContent=DLG.full.slice(0,n)}}

/* skærme */
const scr=$('#scr');
function showHud(on){$('#top').hidden=!on;$('#goal').hidden=!on;$('#abil').hidden=!on;if(!on){$('#bossbar').hidden=true;$('#dialog').hidden=true}requestAnimationFrame(measureHud)}
function paintPortraits(){scr.querySelectorAll('canvas[data-p]').forEach(c=>{const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(portrait(c.dataset.p),0,0)})}
function screen(html,dim){scr.className=dim?'dim':'';scr.innerHTML=html;scr.hidden=false;paintPortraits();scr.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();audio();sfx.tick();ACT[b.dataset.act]()}))}
function hideScreen(){scr.hidden=true;scr.innerHTML=''}
function showTitle(){
  G.state='title';showHud(false);const sv=loadSave();
  screen(`<div class="card">
    <canvas class="bigp" data-p="neck" width="32" height="32"></canvas>
    <h1>Neck Cheese Man</h1>
    <p class="sub">og Turtle Turd-fabrikken</p>
    <div class="btns">${sv>0&&sv<5?`<button class="px main" data-act="cont">Fortsæt · bane ${sv+1}</button><button class="px alt" data-act="new">Nyt spil</button>`:`<button class="px main" data-act="new">Nyt spil</button>`}</div>
    <ul class="how"><li>Tryk på gulvet for at gå</li><li>Tryk på en turd for at give den et aroma-pust</li><li>Tryk på ting og personer for at bruge dem</li><li>Evnerne sidder nederst på skærmen</li></ul>
    <p class="foot">Til kollegaen på farten i Østen · Hilsen R&amp;D</p></div>`);
}
function showCard(i){
  showHud(false);G.state='card';
  if(i>=LEVELS.length){showTitle();return}
  const L=LEVELS[i];
  screen(`<div class="card"><span class="eyebrow">${BANNERS[i]} af 5</span><h2>${L.name}</h2><p>${L.flavor}</p><div class="btns"><button class="px main" data-act="go">Videre</button></div></div>`);
  ACT.go=()=>{hideScreen();loadLevel(i);showHud(true);G.state='play';resize();dialog(L.intro)};
}
function showDead(){
  showHud(false);
  screen(`<div class="card"><canvas class="bigp" data-p="neck" width="32" height="32" style="filter:grayscale(.6)"></canvas><h2>Du besvimede af stanken!</h2><p>Selv Neck Cheese Man har grænser. Du starter forfra i rummet, men alt, du har klaret, er stadig klaret.</p><div class="btns"><button class="px main" data-act="retry">Prøv igen</button></div></div>`,true);
}
function showWin(){
  showHud(false);sfx.win();save(0);
  const secs=Math.round((performance.now()-G.stats.t0)/1000);
  screen(`<div class="card"><span class="eyebrow">Fabrikken er reddet</span><h2>Recall afværget!</h2>
   <div class="row"><canvas data-p="neck" width="32" height="32"></canvas><canvas data-p="egern" width="32" height="32"></canvas><canvas data-p="martin" width="32" height="32"></canvas><canvas data-p="eivind" width="32" height="32"></canvas></div>
   <p>The Great Recall Turd er tætnet med ost, og sample review er udskudt til i morgen.</p>
   <div class="stats"><span>Tid</span><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>Turds besejret</span><b>${G.stats.kills}</b><span>Aroma-pust</span><b>${G.stats.puffs}</b><span>Besvimelser</span><b>${G.stats.falls}</b></div>
   <div class="btns"><button class="px main" data-act="new">Spil igen</button></div></div>`);
}
function showMenu(){
  if(G.state!=='play')return;G.state='menu';
  screen(`<div class="card"><h2>Pause</h2><div class="btns"><button class="px main" data-act="resume">Fortsæt</button><button class="px alt" data-act="restart">Start banen forfra</button><button class="px alt" data-act="title">Til titelskærmen</button></div></div>`,true);
}
const ACT={
  new(){G.stats={puffs:0,kills:0,t0:performance.now(),falls:0};G.rage=0;save(0);showCard(0)},
  cont(){G.stats={puffs:0,kills:0,t0:performance.now(),falls:0};G.rage=0;showCard(loadSave())},
  retry(){hideScreen();showHud(true);respawn();G.state='play';buildAbil();if(G.bossActive)$('#bossbar').hidden=false},
  resume(){hideScreen();G.state='play'},
  restart(){hideScreen();loadLevel(G.lv);showHud(true);G.state='play';resize()},
  title(){hideScreen();showTitle()},
};
$('#menu').addEventListener('click',e=>{e.stopPropagation();audio();showMenu()});
function setMuteIcon(){$('#mute').textContent=AC.muted?'×':'♪';$('#mute').style.opacity=AC.muted?.6:1}
$('#mute').addEventListener('click',e=>{e.stopPropagation();audio();AC.muted=!AC.muted;try{localStorage.setItem('ncm_mute',AC.muted?'1':'0')}catch(_){}setMuteIcon()});
setMuteIcon();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')showMenu()});

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.state==='play')update(dt);
  else if(G.state==='dialog'){G.time+=dt;updDialog(dt);updParty(dt)}
  if(G.state==='play'||G.state==='dialog')updFx(dt);
  render(dt);
  requestAnimationFrame(loop);
}
resize();
// baggrund bag titelskærmen
loadLevel(0);G.player.x=-50;
showTitle();
requestAnimationFrame(loop);
window.__G=G;window.__ACT=ACT;window.__LEVELS=LEVELS;window.__tap=onTap;

if(document.querySelector('link[rel="manifest"]')&&'serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
