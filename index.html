<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1326">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neck Cheese">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Neck Cheese Man</title>
<style>
/* Layout: fuldskærms canvas-spil med HUD øverst, evneknapper nederst, dialog og minispil som paneler */
:root{
  --ink:#0d0a14; --night:#1a1326; --panel:#2a2040; --panel2:#3a2c55;
  --cheese:#f6c431; --cheese2:#d08a1a; --cape:#c8372d; --stink:#9bc53d; --cream:#fff4dc; --mute:#b9a9d6; --blue:#3b6fd8;
  --ui: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--ui);background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--ui);color:var(--cream);cursor:pointer;-webkit-tap-highlight-color:transparent}
.px{background:var(--panel2);border:3px solid var(--ink);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.12)}
.px:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
.px:focus-visible{outline:3px solid var(--cheese);outline-offset:2px}
canvas.pix{image-rendering:pixelated;image-rendering:crisp-edges}

#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 14px calc(env(safe-area-inset-left,0px) + 10px);
  background:linear-gradient(var(--ink) 55%,rgba(13,10,20,0));pointer-events:none}
#top button{pointer-events:auto;width:38px;height:38px;font-size:17px;font-weight:900;padding:0;display:grid;place-items:center}
#lvl{flex:1;min-width:0}
#lvlname{font-weight:900;font-size:15px;letter-spacing:.02em;color:var(--cheese);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--ink)}
#hrow{display:flex;align-items:center;gap:10px;margin-top:4px}
#hearts{display:flex;gap:3px}
#hearts i{width:18px;height:16px;background-size:100% 100%;image-rendering:pixelated}
#score{font-size:14px;font-weight:900;color:var(--cream);font-variant-numeric:tabular-nums;background:rgba(246,196,49,.14);border:2px solid rgba(246,196,49,.5);padding:0 7px;line-height:20px}
#score.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18);color:var(--cheese)}}
#goal{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 62px);max-width:calc(100% - 24px);
  background:rgba(13,10,20,.82);border:2px solid var(--panel2);padding:5px 10px;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#goal b{color:var(--cheese)}
#goal.urgent{border-color:var(--cape);background:rgba(90,16,12,.9)}
#goal.wrap{white-space:normal;text-overflow:clip;text-align:center;width:max-content;max-width:min(380px,calc(100% - 24px));line-height:1.35}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);width:min(320px,calc(100% - 32px));pointer-events:none;text-align:center}
#bossname{font-size:11px;font-weight:900;letter-spacing:.12em;color:#ffb3a8;text-shadow:2px 2px 0 var(--ink)}
#bossbar div{height:10px;border:3px solid var(--ink);background:#3a1a14;margin-top:3px}
#bossbar i{display:block;height:100%;background:linear-gradient(#e0483e,#a3241c);width:100%;transition:width .15s}

#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 124px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--cream);color:var(--ink);border:3px solid var(--ink);padding:7px 11px;font-size:13px;font-weight:700;max-width:340px;box-shadow:4px 4px 0 rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast b{color:var(--cape)}
.toast.fb{background:#3b5998;color:#fff}.toast.fb b{color:#fff}
.toast.pts{background:var(--cheese)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#abil{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:7px;
  padding:16px calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 8px);
  background:linear-gradient(rgba(13,10,20,0),var(--ink) 45%)}
.ab{position:relative;flex:1 1 0;max-width:72px;min-width:0;height:74px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.ab canvas{width:40px;height:40px;image-rendering:pixelated;border:2px solid var(--ink)}
.ab span{font-size:11.5px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.ab .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(13,10,20,.72);pointer-events:none}
.ab.ready{background:#5a3f1a;animation:glow .8s steps(2) infinite}
@keyframes glow{50%{background:#8a5a1a}}
.ab.off{filter:grayscale(1) brightness(.7)}
#abil:empty{display:none}
.btns button.act{background:#22408a;font-size:15px}
.btns button.act small{display:block;font-size:11.5px;font-weight:700;opacity:.8;letter-spacing:.04em;margin-top:2px}
.share{font-size:13px!important;font-weight:700;background:rgba(13,10,20,.55);border:2px dashed var(--panel2);padding:8px 10px;user-select:text;-webkit-user-select:text}

#dialog{position:absolute;left:0;right:0;bottom:0;padding:0 calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 10px)}
#dbox{max-width:600px;margin:0 auto;display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;background:var(--cream);color:var(--ink);border:4px solid var(--ink);padding:10px;box-shadow:0 0 0 3px var(--cheese),6px 8px 0 3px rgba(0,0,0,.5);min-height:96px}
#dp{width:84px;height:84px;image-rendering:pixelated;border:3px solid var(--ink)}
#dtext{min-width:0}
#dn{display:block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--cape);margin-bottom:4px}
#dt{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;min-height:3.9em}
#dmore{display:block;text-align:right;font-size:12px;font-weight:900;color:var(--cheese2);animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}

#mg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,10,20,.78);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
#mgbox{width:min(400px,100%);background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--cheese),6px 8px 0 3px rgba(0,0,0,.5);padding:12px;display:flex;flex-direction:column;gap:8px}
#mghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#mgtitle{font-size:19px;font-weight:900;color:var(--cape);text-transform:uppercase;letter-spacing:.03em}
#mgpts{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cheese2)}
#mghelp{margin:0;font-size:14px;font-weight:600;line-height:1.35}
#mgc{width:100%;aspect-ratio:4/3;border:3px solid var(--ink);display:block;touch-action:none}
#mgmsg{margin:0;min-height:1.4em;font-size:15px;font-weight:800;text-align:center}

#scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px),
    radial-gradient(ellipse at 50% 30%,#2e2146,var(--night) 70%)}
#scr.dim{background:rgba(13,10,20,.84)}
.card{width:min(420px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto}
.card h1{margin:0;font-weight:900;font-size:clamp(38px,11vw,58px);line-height:.92;letter-spacing:-.01em;text-transform:uppercase;color:var(--cheese);
  text-shadow:3px 3px 0 var(--cape),6px 6px 0 var(--ink);text-wrap:balance}
.card h2{margin:0;font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1;color:var(--cheese);text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.card .sub{margin:-4px 0 0;font-size:16px;font-weight:800;color:var(--stink);letter-spacing:.02em}
.card .eyebrow{font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.card p{margin:0;font-size:15px;line-height:1.45;max-width:34ch}
.new{display:inline-block;background:var(--cape);color:var(--cream);font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:2px solid var(--ink);transform:rotate(-3deg)}
#tcv{width:min(230px,58vw);aspect-ratio:120/116;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bigp{width:min(170px,42vw);height:min(170px,42vw);image-rendering:pixelated;border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.45)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row canvas{width:58px;height:58px;image-rendering:pixelated;border:3px solid var(--ink)}
.btns{display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}
.btns button{font-size:18px;font-weight:900;padding:13px 16px;letter-spacing:.02em}
.btns button.main{background:var(--cape)}
.btns button.alt{background:var(--panel);font-size:15px}
.how{list-style:none;margin:0;padding:10px 12px;background:rgba(13,10,20,.55);border:2px solid var(--panel2);font-size:13px;line-height:1.6;text-align:left;width:min(300px,100%);box-sizing:border-box}
.how li::before{content:"▸ ";color:var(--cheese)}
.foot{font-size:12px!important;color:var(--mute)}
.rec{font-size:13px!important;font-weight:800;color:var(--cheese)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 18px;font-size:14px;background:rgba(13,10,20,.55);border:2px solid var(--panel2);padding:10px 14px;text-align:left}
.stats b{font-variant-numeric:tabular-nums;color:var(--cheese);text-align:right}
.stats .tot{font-size:17px;font-weight:900;border-top:2px solid var(--panel2);padding-top:6px}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 14px;text-align:center}
.pill.blue{background:#22408a}.pill.red{background:#8e2420}
.pill canvas{width:78px;height:78px;image-rendering:pixelated;border:3px solid var(--ink)}
.pill strong{font-size:17px;font-weight:900}
.pill em{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.pill small{font-size:12.5px;line-height:1.35;font-weight:600}
.pill .abl{font-size:12px;font-weight:900;color:var(--cheese)}
#evo{width:min(300px,76vw);aspect-ratio:120/116;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.evotxt{min-height:2.9em;font-size:17px!important;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="top" hidden>
    <div id="lvl"><div id="lvlname"></div><div id="hrow"><div id="hearts"></div><b id="score">0</b></div></div>
    <button id="mute" class="px" aria-label="Lyd til/fra">♪</button>
    <button id="menu" class="px" aria-label="Menu">II</button>
  </div>
  <div id="goal" hidden></div>
  <div id="bossbar" hidden><span id="bossname"></span><div><i id="bosshp"></i></div></div>
  <div id="toasts"></div>
  <div id="abil" hidden></div>
  <div id="dialog" hidden>
    <div id="dbox"><canvas id="dp" width="32" height="32"></canvas><div id="dtext"><b id="dn"></b><p id="dt"></p><span id="dmore">▼ tryk</span></div></div>
  </div>
  <div id="mg" hidden>
    <div id="mgbox"><div id="mghead"><b id="mgtitle"></b><span id="mgpts"></span></div><p id="mghelp"></p><canvas id="mgc" class="pix"></canvas><p id="mgmsg"></p></div>
  </div>
  <div id="scr"></div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const rnd=Math.random, pick=a=>a[(rnd()*a.length)|0], clamp=(v,a,b)=>v<a?a:v>b?b:v;
const UIF='ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const fmt=n=>Math.round(n).toLocaleString('da-DK');

/* ================= PIXEL ART ================= */
const PAL={k:'#1b1420',s:'#f2b48a',S:'#d98b62',n:'#e8743b',h:'#4a2c1a',H:'#7a4a2a',r:'#c8372d',R:'#8e2420',y:'#f6c431',Y:'#d08a1a',b:'#2a2735',B:'#45405a',w:'#ffffff',g:'#8a8f99',G:'#555a64',l:'#8fc0e6',L:'#5b8fc0',o:'#c8742a',O:'#8a4a1a',a:'#e0b070',c:'#b8bcc6',u:'#fff27a',U:'#ffd23a',f:'#d2582a',F:'#9a3a1a',m:'#3a2418',p:'#6aa84f',P:'#3f7a34',t:'#7a4a24',T:'#4e2c14',x:'#a8703a',j:'#34405e',d:'#d8b27a',e:'#e0b08a',E:'#2a1a10'};
const ROWS={
neck:["......kkkk......",".....kssssk.....","....kssssssk....","...hksksskskh...","..hhksnnnnskhh..","..hhkmmnnmmkhh..","...hkssmmssk....",".....kssk.......","..yyyyyyyyyyyy..",".ryyYyyyyyYyyyr.",".rrkyyYyyyyykrr.",".rrbbkyyyykbbrr.",".rrbbbbrrbbbbrr.","..rbbbbkkbbbbr..","...bbbb..bbbb...","...kkk....kkk..."],
egern:["..oo......oo....","..oOo....oOo....","..oooooooooo....","..oohhhhhhoo....","..ooskssksoo....","..oosssssso.OO..","..oohsshhoo.OOO.","...oohhhhoo.OoOO","..oooooooooo.oOO",".ooooaaooooooOO.",".sooaOaaooosOO..","..ooooaoooo.O...","..oOOOOOOOo.....","..oooo..oooo....","..oooo..oooo....","..OOO....OOO...."],
badboy:["....hhhhhh......","...hhHhhHhh.....","...hssssssh.....","...skssskss.....","...ssssSsss.....","...hsHHHHsh.....","....hhhhhh......",".....ssss.......","...llllllll.....","..llllLlllll....","..lsllLllllsa...","..lslllLllls....","...jjjjjjjj.....","...jjjj.jjj.....","...jjj..jjj.....","...kkk..kkk....."],
martin:["...u.u.u.u.u....","...UcUcUcUcU....","...ccccccccc....","...hhssssshh....","...hgkgsgkgh....","...hssssSssh....","...hhHssHhhh....","....hhHHHhh.....",".....hhhhh......","...jjjjjjjjj....","..jjjjkjjjjjj...","..sjjjjkjjjjs...","...jjjjjjjjj....","...GGGG.GGGG....","...GGG...GGG....","...kkk...kkk...."],
eivind:["................","....ffffff......","...fffFffff.....","..kfssssssfk....","..rsskssksr.....","..rssssSsssr....","..kfsswwssfk....","...fFFFFFFf.....","....ffffff......","...gggggggg.....","..ggggGgggggg...","..sgggGggggs....","...gggggggg.....","...jjjj.jjj.....","...jjj..jjj.....","...kkk..kkk....."],
don:["................","....bbbbbb......","...bbbbbbbb.....","..kkkkkkkkkk....","...heeeeeeh.....","...ekeeeeke.....","...eeeeSeee.....","...eEEEEEEEe....","....eEEEEe......",".....eeee.......","...wwwwwwww.....","..ewwwwwwwwe....","..ewwwwwwwwe....","...jjjjjjjj.....","...jjj..jjj.....","...kkk..kkk....."],
cstar:["................","....HHHHHH......","...HssssssH.....","...skssssks.....","...ssssSsss.....","...HsswwssH.....","...HHHHHHHH.....","....HHHHHH......",".....ssss.......","...rLrLrLrL.....","..rLRLrLRLrL....","..sRLrLRLrLs....","...LrLrLrLr.....","...jjjj.jjj.....","...jjj..jjj.....","...kkk..kkk....."],
turd:["................","................",".......tt.......","......tTxt......",".....tttttt.....","....tTTxTTTt....","...ttwkttwkttt..","...tTTTTTTTTt...","..ttxkkkkkkxtt..",".pTTTTTTTTTTTTp.","ppttttttttttttpp",".PTTTTTTTTTTTTP.","..pp........pp..","................","................","................"],
cheese:[".......kk",".....kkyk","...kkyyyk",".kkyyYyyk","kyyyyyyyk","kyYyyyYyk","kyyyyyyyk","kkkkkkkkk"],
};
ROWS.eivindA=ROWS.eivind.slice(); ROWS.eivindA[0]="dd.d......d.dd.."; ROWS.eivindA[1]=".dddffffffddd...";
ROWS.cheeseE=ROWS.cheese.map(r=>r.replace(/y/g,'B').replace(/Y/g,'b'));
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x);return c}
function tools(x){return{
  r:(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)},
  e:(cx,cy,rx,ry,c)=>{x.fillStyle=c;for(let yy=-ry;yy<=ry;yy++){const ww=Math.round(rx*Math.sqrt(Math.max(0,1-(yy*yy)/(ry*ry+.01))));x.fillRect(Math.round(cx-ww),Math.round(cy+yy),ww*2,1)}}}}
function fromRows(rows){const w=Math.max(...rows.map(r=>r.length));return mk(w,rows.length,x=>{rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=PAL[r[i]];if(c){x.fillStyle=c;x.fillRect(i,j,1,1)}}})})}
function whiteOf(img){return mk(img.width,img.height,x=>{x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,img.width,img.height)})}
const SPR={};for(const k in ROWS)SPR[k]=fromRows(ROWS[k]);
SPR.turdW=whiteOf(SPR.turd);
SPR.moon=mk(32,32,x=>{const {r,e}=tools(x),K='#1b1420';
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;e(16+Math.cos(a)*12,16+Math.sin(a)*12,3,3,'#5a3210')}
  e(16,16,13,13,'#5a3210');for(let i=0;i<12;i++){const a=i/12*Math.PI*2;e(16+Math.cos(a)*12,16+Math.sin(a)*12,2,2,'#c98a3a')}
  e(16,16,12,12,'#c98a3a');e(16,16,9,9,'#a86a24');e(16,16,8,8,'#dca24c');
  r(15,9,2,15,'#b87a2c');r(9,15,15,2,'#b87a2c');e(16,16,3,3,'#b87a2c');e(16,16,2,2,'#e8b860');
  r(10,11,5,4,'#fff');r(18,11,5,4,'#fff');r(12,12,2,2,'#c8372d');r(19,12,2,2,'#c8372d');r(9,9,6,1,K);r(18,9,6,1,K);r(10,10,2,1,K);r(21,10,2,1,K);
  r(11,20,11,3,K);r(12,20,2,1,'#fff');r(16,20,2,1,'#fff');r(19,20,2,1,'#fff');r(13,22,7,1,'#8e2420');
  r(7,28,5,3,'#5a3210');r(20,28,5,3,'#5a3210');});
SPR.moonW=whiteOf(SPR.moon);
SPR.sheet=mk(16,16,x=>{const {r}=tools(x);r(3,1,10,14,'#1b1420');r(4,2,8,12,'#fff');r(4,2,8,2,'#21a366');for(let y=6;y<14;y+=2)r(5,y,6,1,'#9ad0b0');r(7,4,1,10,'#9ad0b0')});

function mkMember(id,x,y){return {id,x,y,flip:false,bubble:null,hop:null}}
function mkTurd(x,y,type,hp){return {type,x:x+.5,y:y+.5,hp,maxhp:hp,r:.45,moving:false,tx:0,ty:0,wait:rnd()*1.5,stun:0,flash:0,shootT:1.5+rnd()*2,dashT:1.5+rnd()*2,flip:rnd()<.5,dead:false,spd:1}}
function mkBoss(x,y,kind){const hp=kind==='moon'?50:36;return {boss:true,kind,type:'boss',x:x+.5,y:y+.5,sx:x+.5,sy:y+.5,hp,maxhp:hp,r:1,stun:0,flash:0,shootT:2,rot:0,vol:0,flip:false,dead:false,summons:[.66,.33],bubble:null}}
function say(e,text,t=2.8){if(e)e.bubble={text,t}}
const member=id=>G.party.find(m=>m.id===id);
const comp=()=>G.companion?member(G.companion):null;

function loadLevel(i){
  const L=LEVELS[i];G.lv=i;G.def=L;G.H=L.map.length;G.W=L.map[0].length;
  G.grid=L.map.map(r=>r.split(''));
  G.foes=[];G.shots=[];G.parts=[];G.pops=[];G.evs=[];G.npc=null;G.boss=null;G.seen={};G.caps=[];G.portal=0;
  G.flags={antlers:i>=5,keycard:false,bridge:false};G.doorOpen=false;G.bossStarted=false;G.bossActive=false;G.timer=L.timer||0;G.flight=false;G.qSaid=false;
  let sx=1,sy=1;
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){
    const ch=G.grid[y][x];
    if(ch==='@'){sx=x;sy=y;G.grid[y][x]='.'}
    else if(ch==='N'){G.npc={id:L.npc,x:x+.5,y:y+.5,gx:x,gy:y,bubble:null,greeted:false,flip:false};G.grid[y][x]='.'}
    else if(ch==='T'){G.foes.push(mkTurd(x,y,pick(L.turds),L.thp));G.grid[y][x]='.'}
    else if(ch==='x'){G.boss=mkBoss(x,y,L.boss);G.foes.push(G.boss);G.grid[y][x]='.'}
    else if(ch==='d'||ch==='c'){G.caps.push({id:ch==='d'?'don':'cstar',x:x+.5,y:y+.5,gx:x,gy:y,freed:false,bubble:null,flip:ch==='c'});G.grid[y][x]='.'}
  }
  G.start={x:sx+.5,y:sy+.5};
  G.player={id:'neck',x:sx+.5,y:sy+.5,path:null,onArrive:null,target:null,flip:false,moving:false,swing:null,bubble:null,repath:0};
  G.party=[];const ids=[];if(i>=1)ids.push('egern');if(i>=4)ids.push('martin');if(i>=5)ids.push('eivind');
  ids.forEach(id=>G.party.push(mkMember(id,sx+.5,sy+.5)));
  G.trail=[{x:sx+.5,y:sy+.5}];
  G.hp=G.maxhp;G.inv=0;for(const k in G.cd)G.cd[k]=0;G.fbT=has('eivind')?25:0;
  G.leakTotal=leaks();
  if(L.kantine)initKantine();$('#goal').classList.toggle('wrap',!!L.kantine);
  for(const k in PCACHE)if(k.startsWith('eivind'))delete PCACHE[k];
  paintLevel();
  $('#lvlname').textContent=`${L.short} · ${L.name}`;$('#score').textContent=fmt(G.score);
  $('#bossbar').hidden=true;$('#bossname').textContent=L.boss==='moon'?'MÅNEKAGE-MONSTRET':'THE GREAT RECALL TURD';
  buildAbil();renderHearts();lastGoal='';$('#goal').classList.remove('urgent');
  const p=G.player;G.cam.x=p.x*16-VW/2;G.cam.y=p.y*16-VH/2;
}

/* ================= PATHFINDING ================= */
function bfs(sx,sy,goal){
  const W=G.W,H=G.H,prev=new Int32Array(W*H).fill(-1),q=new Int32Array(W*H);let qh=0,qt=0;
  const s=sy*W+sx;prev[s]=s;q[qt++]=s;
  while(qh<qt){
    const c=q[qh++],cx=c%W,cy=(c/W)|0;
    if(goal(cx,cy)){const path=[];let n=c;while(n!==s){path.push([n%W,(n/W)|0]);n=prev[n]}return path.reverse()}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(prev[n]>=0||!walk(nx,ny))continue;prev[n]=c;q[qt++]=n}
  }
  return null;
}
const ptile=()=>[Math.floor(G.player.x),Math.floor(G.player.y)];
function goTo(gx,gy,cb){const [sx,sy]=ptile();const p=bfs(sx,sy,(x,y)=>x===gx&&y===gy);if(!p){noPath();return false}setPath(p,cb);return true}
function goNear(gx,gy,cb){const [sx,sy]=ptile();const p=bfs(sx,sy,(x,y)=>Math.abs(x-gx)+Math.abs(y-gy)===1);if(!p){noPath();return false}setPath(p,cb);return true}
function setPath(p,cb){const pl=G.player;pl.path=p;pl.onArrive=cb||null;pl.target=null}
function noPath(){say(G.player,cnt('1')||cnt('2')?'Der kan jeg ikke gå hen. Måske med en krog?':'Der kan jeg ikke komme hen.',2)}

/* ================= INPUT ================= */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  if(G.state==='dialog'&&DLG.q){advanceDialog();return}
  if(G.mode){const M=NCM[G.mode];if(G.state==='play'&&M.down)M.down(e);return}
  if(G.state!=='play')return;
  const wx=(e.clientX*DPR/P+G.cam.x)/16,wy=(e.clientY*DPR/P+G.cam.y)/16;
  onTap(wx,wy);
},{passive:false});
const modeEv=n=>e=>{const M=G.mode&&NCM[G.mode];if(M&&M[n])M[n](e)};
cv.addEventListener('pointerup',modeEv('up'));cv.addEventListener('pointercancel',modeEv('up'));cv.addEventListener('pointermove',modeEv('move'));
addEventListener('keydown',e=>{const M=G.mode&&NCM[G.mode];if(M&&M.key&&G.state==='play')M.key(e)});
addEventListener('keyup',e=>{const M=G.mode&&NCM[G.mode];if(M&&M.keyup)M.keyup(e)});
function onTap(wx,wy){
  const pl=G.player;if(pl.swing)return;
  const gx=Math.floor(wx),gy=Math.floor(wy);
  G.tap={x:gx,y:gy,t:.5};
  let best=null,bd=1;
  for(const f of G.foes){if(f.dead)continue;const d=Math.hypot(f.x-wx,f.y-.3-wy)-(f.boss?.8:0);if(d<bd){bd=d;best=f}}
  if(best){pl.target=best;pl.path=null;pl.onArrive=null;pl.repath=0;return}
  if(G.npc&&Math.hypot(G.npc.x-wx,G.npc.y-.3-wy)<.9){goNear(G.npc.gx,G.npc.gy,talkNpc);return}
  for(const c of G.caps){if(Math.hypot(c.x-wx,c.y-.3-wy)<.9){if(c.freed)goNear(c.gx,c.gy,()=>say(c,c.id==='don'?'Klar, når I er klar. Helst nu.':'Har I set, hvor flot den datamodel er?'));else goNear(c.gx,c.gy+1,()=>interact(c.gx,c.gy+1));return}}
  const ch=cell(gx,gy);
  if(ch==='1'||ch==='2'){goTo(gx,gy,()=>swing(gx,gy));return}
  if(INTER.has(ch)){goNear(gx,gy,()=>interact(gx,gy));return}
  if(walk(gx,gy)){goTo(gx,gy);return}
}

      const eg=member('egern');

      else say(pl,'Den hylde er alt for høj. Jeg kender måske en, der kan klatre?');
      break;}
    case 's':say(pl,G.lv===6?pick(['Duty free. 4 liter parfume til 89 kr. Fristende.','Datoer, chokolade og en kamel af guld. Normal lufthavn.']):pick(['Samples. Ingen af dem er godkendt.','Hylde med telte. Én af dem drypper vist.','Lagerhylde. Den har set ting.']));break;
    case 'B':say(pl,pick(['Kasser med samples. Mærket: “HASTER!!!” fra 2022.','Der står SAMPLE på. Alt her står der SAMPLE på.']));break;
    case 'm':say(pl,pick(['En symaskine. Den syer stadig, helt af sig selv.','Her blev Turtle Turd-designet syet. Hvem godkendte det?']));break;
    case 'k':say(pl,G.lv===9?pick(['En pizza med ananas. Ingen siger noget.','Bord 7 venter stadig på deres calzone.']):G.lv===6?pick(['Gate-sæder. Nogen sover under dem.','Der ligger en glemt nakkepude. Den lugter af Eivind.']):G.lv===8?pick(['Hotelbord. Der står en kokosnød med sugerør.','En menu på vietnamesisk. Der er tegnet en elg på bagsiden.']):pick(['Et bord med en kold kop kaffe og et Excel-ark.','Mødebord. Der står “Glem Illustrator, glem Excel” på en post-it.']));break;
    case 'r':say(pl,pick(['En Perfion-server. Den lyser bekymret.','Serveren summer. Den har det ikke godt.','På skærmen står der bare 💩💩💩.']));break;
    case 'P':{
      const mt=member('martin');
      if(G.flags.bridge){say(pl,'Printeren hviler sig.');break}
      if(!mt){say(pl,'En 3D-printer. Jeg aner ikke, hvordan den virker. Ham med lyshjelmen ved det sikkert.');break}
      say(mt,'Printer bro… 4%… 37%… 100%!',2.5);sfx.print();
      const bs=[];for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++)if(G.grid[y][x]==='b')bs.push([x,y]);

      G.evs.push({t:.7+bs.length*.45,fn:()=>{G.flags.bridge=true;say(mt,'Lavet af genbrugsplast og dårlige produktidéer.');toast('Broen er printet!')}});

      const ev=member('eivind');

      if(!ev){say(pl,'En spand rådden fisk. Lugten er… faktisk ret hyggelig?');break}

      break;

        dialog(c.id==='don'?[['don','Endelig. Jeg har siddet fast i et Perfion-felt i tre dage. Felt-ID 40213. Uden kaffe.'],['don','Jeg skulle have været i Dubai for to dage siden. Og det her system? Det kunne være et Excel-ark.']]:
          [['cstar','Tak! Selvom… jeg fandt faktisk tre felter, der burde normaliseres. Kan vi ikke lige—'],['neck','Nej.'],['cstar','Okay. Men datamodellen er virkelig smuk indefra.']],()=>{if(G.caps.every(k=>k.freed))bothFreed()})});

function updPlayer(dt){
  const pl=G.player;pl.moving=false;
  if(pl.swing){const s=pl.swing;s.t+=dt;const u=Math.min(1,s.t/s.dur);pl.x=s.x0+(s.x1-s.x0)*u;pl.y=s.y0+(s.y1-s.y0)*u;pl.lift=Math.sin(u*Math.PI)*1.3;

  if(pl.target){
    const t=pl.target;
    if(t.dead){pl.target=null}
    else{const d=Math.hypot(t.x-pl.x,t.y-pl.y);
      if(d<1.6+(t.boss?.6:0)){pl.path=null;pl.flip=t.x<pl.x;if(G.cd.puff<=0&&(!t.boss||G.bossActive))puff()}
      else{pl.repath-=dt;if(pl.repath<=0||!pl.path||!pl.path.length){pl.repath=.35;const [sx,sy]=ptile();const tx=Math.floor(t.x),ty=Math.floor(t.y);pl.path=bfs(sx,sy,(x,y)=>Math.abs(x-tx)+Math.abs(y-ty)<=1)||null;if(!pl.path)pl.target=null}}}
  }
  if(pl.path&&pl.path.length){
    const [tx,ty]=pl.path[0],cx=tx+.5,cy=ty+.5,dx=cx-pl.x,dy=cy-pl.y,d=Math.hypot(dx,dy);

    if(d<=sp){pl.x=cx;pl.y=cy;pl.path.shift();if(cell(tx,ty)==='E'){reachExit();return}}

}

    if(m.hop){const h=m.hop;h.t+=dt;const u=Math.min(1,h.t/h.dur),s=u<.5?u*2:(1-u)*2;
      if(u>=.5&&!h.done){h.done=true;h.mid&&h.mid()}
      m.x=h.x0+(h.tx-h.x0)*s;m.y=h.y0+(h.ty-h.y0)*s;m.lift=Math.sin(s*Math.PI/2)*1.2;m.flip=h.tx<h.x0;
      if(u>=1){m.hop=null;m.lift=0}return}
    const dx=tp.x-m.x,dy=tp.y-m.y;m.moving=Math.hypot(dx,dy)>.05;if(Math.abs(dx)>.02)m.flip=dx<0;

function updFoes(dt){

function evoStep(dt){
  const E=EVO;E.t+=dt;const t=E.t,c=E.cv,x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.imageSmoothingEnabled=false;
  x.fillStyle='#120c1e';x.fillRect(0,0,120,116);
  const flick=t>.7&&t<2.7;
  if(t>.5&&t<3){x.save();x.translate(60,58);x.rotate(t*.9);for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.fillStyle=i%2?'rgba(246,196,49,.12)':'rgba(255,255,255,.06)';x.beginPath();x.moveTo(0,0);x.lineTo(90,-14);x.lineTo(90,14);x.fill()}x.restore()}
  if(flick){E.sw-=dt;if(E.sw<=0){E.showBig=!E.showBig;const p=(t-.7)/2;E.sw=.3*(1-p)+.035;tone('square',300+p*900,300+p*900,.05,.05)}}
  const big=BIG.complete&&BIG.naturalWidth;
  if(t<=.7){if(big)x.drawImage(BIG,8,6+((t*6|0)%2))}
  else if(flick){if(E.showBig){if(BIGW)x.drawImage(BIGW,8,6)}else{x.drawImage(whiteNeck(),12,10,96,96)}}
  else if(t<3.1){if(!E.flashed){E.flashed=true;sfx.pling();sfx.win()}x.fillStyle='#fff';x.fillRect(0,0,120,116)}
  else{const b=((t*3)|0)%2;x.drawImage(SPR.neck,12,10-b,96,96);for(let i=0;i<6;i++){const a=t*2+i;x.fillStyle='#fff27a';x.fillRect(60+Math.cos(a)*48|0,58+Math.sin(a)*40|0,2,2)}
    const tx=$('#evotxt');const msg='Neck Cheese Man blev til… Neck Cheese Man i 16×16!';if(tx.textContent!==msg)tx.textContent=msg;if(t>5.2)endEvo()}
  if(t>.7&&t<3.1){const tx=$('#evotxt');const msg='Hvad? Neck Cheese Man er ved at forvandle sig!';if(tx.textContent!==msg)tx.textContent=msg}
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    const M=G.mode?NCM[G.mode]:null;
    if(M){
      if(G.state==='play')M.update(dt);
      else if(G.state==='dialog'){updDialog(dt);M.idle&&M.idle(dt)}
      else if(G.state==='mini'){mgUpdate(dt);mgDraw()}
      M.render(dt);
    } else {
      if(G.state==='play')update(dt);
      else if(G.state==='dialog'){G.time+=dt;updDialog(dt);updParty(dt)}
      else if(G.state==='mini'){mgUpdate(dt);mgDraw()}
      if(G.state==='play'||G.state==='dialog'||G.state==='mini')updFx(dt);
      render(dt);
    }
    if(TITLE.on&&TITLE.cv){TITLE.t+=dt;drawTitleFig(TITLE.cv,TITLE.t)}
    if(EVO.on)evoStep(dt);
  }catch(err){console.error(err)}
}

  saveProg(act,st){store.set('ncm_act',act);store.set('ncm_st',st);store.set('ncm_score',Math.round(G.score));store.set('ncm_comp',G.companion||'')}};

<script>
/* Minispil: mål samplet, vandsøjletest, pizza og jacuzzi */
(()=>{
'use strict';
const N=window.NCM,$=N.$,{sfx,tone,rnd,pick,clamp,UIF}=N;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const timebar=(a,r,y=118)=>r(0,y,160*clamp(1-a.pt/a.dur,0,1),2,'#f6c431');
const pts=n=>{$('#mgpts').textContent=Math.round(n)+' point'};
function wrap(c,text,maxW){const words=text.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}

/* ---------- Mål samplet (akt 1, bane 1) ---------- */
const PX=.4375,MX=10,GY=96,VMAX=200;
function drawTent(c,r,W,H){
  for(let i=0;i<H;i++){const w=Math.max(2,W*Math.sqrt((i+1)/H));r(MX+W/2-w/2,GY-H+i,w,1.2,((i/5)|0)%2?'#e0782e':'#d06a26')}
  r(MX+W/2-2,GY-H-1,4,1,'#8a3a14');
  const dh=Math.min(H*.5,28),dw=Math.min(W*.24,24);for(let i=0;i<dh;i++){const w=dw*Math.sqrt((i+1)/dh);r(MX+W/2-w/2,GY-dh+i,w,1.2,'#4a2410')}
  c.strokeStyle='rgba(138,58,20,.55)';c.lineWidth=1;c.beginPath();c.moveTo(MX+W/2,GY-H);c.lineTo(MX+W*.22,GY);c.moveTo(MX+W/2,GY-H);c.lineTo(MX+W*.78,GY);c.stroke();
  r(MX+W*.3,GY-H*.62,4,3,'#ffd2a0');r(MX+W*.66,GY-H*.62,4,3,'#ffd2a0');
}
N.MSK.measure={kind:'custom',title:'Mål samplet',
  help:'Stop målebåndet præcist ved teltets kant. Først bredden, så højden fra jorden til toppen.',
  init(a){a.round=0;a.tg=[180+((rnd()*80)|0),100+((rnd()*50)|0)];a.len=0;a.stop=null;a.wait=0;a.sum=0},
  update(a,dt){
    if(a.wait>0){a.wait-=dt;if(a.wait<=0){a.round++;if(a.round>=2){N.mgFinish(Math.round(a.sum));return}a.len=0;a.stop=null;$('#mgmsg').textContent='Nu højden: stop ved toppen af teltet'}return}
    if(a.len===0&&a.round===0)$('#mgmsg').textContent='Bredden: stop ved teltets højre kant';
    const max=a.round?VMAX:320;a.len+=(70+a.len*.5)*dt;
    if(a.len>=max){a.len=max;a.stop=max;a.wait=1.1;sfx.bad();$('#mgmsg').textContent='Målebåndet løb forbi!'}
  },
  tap(a){
    if(a.wait>0)return;
    const err=Math.abs(a.len-a.tg[a.round]),p=err<=4?50:Math.max(0,50-(err-4)*3);
    a.sum+=p;a.stop=a.len;a.wait=1.2;pts(a.sum);p>=40?sfx.good():p>0?tone('square',500,500,.1,.06):sfx.bad();
    $('#mgmsg').textContent=`${a.round?'Højde':'Bredde'}: ${Math.round(a.len)} cm (teltet er ${a.tg[a.round]}) · ${err<=4?'Perfekt!':'afvigelse '+Math.round(err)+' cm'}`;
  },
  draw(a,c,r,T){
    r(0,0,160,120,'#5a5f68');for(let x=0;x<160;x+=16)r(x,0,1,120,'#535860');
    r(0,GY,160,24,'#8a6a4a');r(0,GY,160,2,'#a8845e');
    drawTent(c,r,a.tg[0]*PX,a.tg[1]*PX);
    r(4,4,56,20,'#fff4dc');r(4,4,56,4,'#c8372d');c.fillStyle='#1b1420';c.textAlign='left';c.font=`800 6px ${UIF}`;c.fillText('SAMPLE #'+(a.tg[0]+a.tg[1]),7,17);c.fillText(a.round?'MÅL: HØJDE':'MÅL: BREDDE',7,23);
    const L=a.len*PX;
    if(!a.round){r(MX,GY+3,L,6,'#f6c431');for(let cm=0;cm<=a.len;cm+=10)r(MX+cm*PX,GY+3,1,cm%50?2:4,'#1b1420');r(MX-6,GY+1,7,10,'#c8372d')}
    else{const x=MX+a.tg[0]*PX/2+6;r(x,GY-L,6,L,'#f6c431');for(let cm=0;cm<=a.len;cm+=10)r(x,GY-cm*PX,cm%50?2:4,1,'#1b1420');r(x-2,GY,10,7,'#c8372d')}
    if(a.wait>0&&a.stop!==null){const ok=Math.abs(a.stop-a.tg[a.round])<=4,col=ok?'#7CFC00':'#ff5a5a';
      if(!a.round){r(MX+a.tg[0]*PX,GY-10,1,22,col)}else{const x=MX+a.tg[0]*PX/2;r(x-6,GY-a.tg[1]*PX,20,1,col)}}
    r(98,6,58,22,'#1b1420');r(99,7,56,20,'#0e2a1a');c.font=`900 13px ${UIF}`;c.textAlign='right';c.fillStyle='#7CFC00';c.fillText(Math.round(a.len)+' cm',152,22);
  }
};

/* ---------- Vandsøjletest (akt 1, vandtanken) ---------- */
N.MSK.pressure={kind:'custom',title:'Vandsøjletest',
  help:'Hold fingeren nede for at pumpe. Slip præcis ved 3000 mm. Pumper du for meget, sprænger teltet.',
  init(a){a.p=0;a.v=0;a.hold=false;a.fin=false;a.burst=0},
  update(a,dt){
    if(a.fin)return;
    if(a.hold){a.v+=1250*dt;a.p+=a.v*dt;
      if(a.p>=3600){a.fin=true;a.burst=1;sfx.crash();$('#mgmsg').textContent='BANG! Teltet sprang. Nu er alle våde.';setTimeout(()=>N.mgFinish(0),900)}}
    else if(a.p>0){a.p=Math.max(0,a.p-80*dt)}
    if(!a.fin&&!a.hold)$('#mgmsg').textContent=a.p<50?'Hold fingeren nede for at pumpe…':'Pump videre…';
  },
  tap(a){if(a.fin)return;a.hold=true;a.v=Math.max(a.v*.3,0);$('#mgmsg').textContent='Pumper…'},
  release(a){
    if(!a.hold||a.fin)return;a.hold=false;
    if(a.p<1500){a.v=0;return}
    a.fin=true;const err=Math.abs(a.p-3000),s=err<=25?100:Math.max(0,Math.round(100-(err-25)/6));
    pts(s);s>=80?sfx.good():sfx.bad();$('#mgmsg').textContent=`${Math.round(a.p)} mm · ${err<=25?'Perfekt!':'afvigelse '+Math.round(err)+' mm'}`;
    setTimeout(()=>N.mgFinish(s),900);
  },
  draw(a,c,r,T){
    r(0,0,160,120,'#1c3a4a');r(0,100,160,20,'#14303c');
    const w=a.burst?0:sm(0,3000,a.p);
    for(let i=0;i<34;i++){const ww=4+i*2.6;r(60-ww/2,52+i*1.3,ww,1.4,i%3?'#e0782e':'#c8622a')}
    r(16,96-w*40,90,w*40,'rgba(63,133,192,.55)');
    if(a.burst){for(let i=0;i<20;i++)r(20+((i*37+T*90)%100),40+((i*23+T*60)%60),2,3,'#7fc3ff');c.font=`900 16px ${UIF}`;c.textAlign='center';c.fillStyle='#fff';c.fillText('BANG!',60,40)}
    r(122,6,24,104,'#0d0a14');r(125,9,18,98,'#d8eef8');
    const Y=v=>107-98*clamp(v/4000,0,1);
    r(125,Y(a.p),18,107-Y(a.p),'#3f85c0');r(120,Y(3000)-1,28,2,'#e0483e');r(120,Y(3600),28,1,'#ff9a8a');
    c.font=`800 6px ${UIF}`;c.textAlign='right';c.fillStyle='#fff';[1000,2000,3000,4000].forEach(v=>c.fillText(v,119,Y(v)+2));
    r(6,6,70,20,'#0d0a14');c.font=`900 12px ${UIF}`;c.textAlign='left';c.fillStyle='#7fe0ff';c.fillText(Math.round(a.p+(a.hold?(rnd()-.5)*40:0))+' mm',10,21);
    if(a.hold){r(96,14,10,22,'#8a8f99');r(92,12+((T*20)|0)%4,18,3,'#555a64')}
  }
};

/* ---------- Pizza: hold dig vågen og svar kollegerne ---------- */
const QS=[['Skal vi tage én til?','skål'],['Skål for leverandøren!','skål'],['Har du husket passet?','ja'],['Skal vi have ananas på?','nej'],['Skal vi op kl. 6 i morgen?','ja'],
 ['Var lynlåsen god nok?','nej'],['Skål for Oase!','skål'],['Er du træt?','nej'],['Har du sendt Excel-arket?','ja'],['Skal vi rykke deadline?','nej'],['Smager pizzaen godt?','ja'],
 ['Skål for Neck Cheese Man!','skål'],['Skal vi droppe sample review?','nej'],['Har du set fane 3?','ja'],['Skal vi skåle for MOQ’en?','skål']];
const BTN=[['ja','JA',4],['nej','NEJ',56],['skål','SKÅL',108]];
const pizzaScore=a=>clamp(40*a.awake/a.dur+a.sl*8+a.ok*7-a.bad*5,0,100);
N.MSK.pizza={kind:'custom',title:'Hold dig vågen!',
  help:'Tryk hurtigt for at holde øjnene åbne. Svar kollegerne med Ja, Nej eller Skål. Og fang pizzaen, når den kommer forbi.',
  init(a){a.dur=18;a.eye=1;a.awake=0;a.sl=0;a.ok=0;a.bad=0;a.snore=0;a.bub=[];a.bT=1.2;a.slice=null;a.nextS=1.6;a.qi=(rnd()*QS.length)|0;a.who=0},
  update(a,dt){
    if(a.pt>=a.dur){N.mgFinish(Math.round(pizzaScore(a)));return}
    if(a.snore>0){a.snore-=dt;if(a.snore<=0){a.eye=.65;$('#mgmsg').textContent='Hva? Jeg sov ikke!';sfx.bad()}}
    else{a.eye-=dt*(.3+a.pt*.014+(Math.sin(a.pt*2.3)>.82?.3:0));
      if(a.eye<=0){a.eye=0;a.snore=1.6;$('#mgmsg').textContent='Zzz…';tone('sawtooth',90,70,.8,.06)}
      if(a.eye>.35)a.awake+=dt}
    a.bT-=dt;if(a.bT<=0&&a.bub.length<4){a.bT=Math.max(1.1,2-a.pt*.045);a.qi=(a.qi+1+((rnd()*3)|0))%QS.length;a.who^=1;
      a.bub.push({q:QS[a.qi][0],ans:QS[a.qi][1],who:a.who,x:14+rnd()*76,y:30+rnd()*36,t:0});tone('sine',700,800,.05,.04)}
    for(const b of a.bub)b.t+=dt;
    a.nextS-=dt;if(!a.slice&&a.nextS<=0)a.slice={x:rnd()<.5?-16:176,ph:rnd()*9};
    if(a.slice){const s=a.slice;s.ph+=dt;const dir=s.x0===undefined?(s.x0=s.x<0?1:-1):s.x0;
      s.x+=dir*(26+22*Math.sin(s.ph*1.9)+(Math.sin(s.ph*.7)>.85?-60:0))*dt;s.y=74+Math.sin(s.ph*3.3)*9+Math.sin(s.ph*1.2)*5;
      if(s.x<-24||s.x>184){a.slice=null;a.nextS=.8+rnd()*1.2}}
    pts(pizzaScore(a));
  },
  tap(a,x,y){
    if(a.snore>0)return;
    if(y>=103){const b=BTN.find(([,,bx])=>x>=bx&&x<bx+48);if(!b)return;
      const q=a.bub.shift();if(!q){$('#mgmsg').textContent='Ingen har spurgt om noget.';return}
      if(q.ans===b[0]){a.ok++;sfx.good();$('#mgmsg').textContent=pick(['Godt svar.','Præcis.','Skål!','Kollegerne nikker.'])}
      else{a.bad++;sfx.bad();$('#mgmsg').textContent=b[0]==='skål'?'Skål? Det var et spørgsmål.':q.ans==='skål'?'Man siger skål, når der skåles!':pick(['Øh… okay?','Det var et mærkeligt svar.','Nu kigger alle på dig.','Martin skriver det ned.'])}
      return}
    const covered=a.bub.some(b=>x>b.x-2&&x<b.x+54&&y>b.y-2&&y<b.y+24);
    if(!covered&&a.slice&&a.eye>.35&&Math.abs(x-a.slice.x)<15&&Math.abs(y-a.slice.y)<14){a.sl++;a.slice=null;a.nextS=.9+rnd()*1.2;sfx.good();a.eye=Math.min(1,a.eye+.2);return}
    a.eye=Math.min(1,a.eye+.075);tone('triangle',700,900,.04,.03);
  },
  draw(a,c,r,T){
    const nod=(1-a.eye)*7;c.save();c.translate(0,nod);
    r(0,-10,160,140,'#2a1a14');r(0,0,160,50,'#3a2418');r(8,6,44,22,'#1b1420');r(10,8,40,18,'#24304a');
    c.font=`900 8px ${UIF}`;c.textAlign='center';c.fillStyle=((T*2)|0)%2?'#ff5a5a':'#ff8a6a';c.fillText('PIZZA',30,21);
    c.drawImage(N.portrait('martin'),38,20,30,30);c.drawImage(N.portrait('eivind'),92,20,30,30);
    for(let x=0;x<160;x+=12)for(let y=50;y<130;y+=12)r(x,y,12,12,((x+y)/12)%2?'#f2e8d8':'#c8372d');
    if(a.slice){const X=a.slice.x,Y=a.slice.y;c.fillStyle='#e8a040';c.beginPath();c.moveTo(X-13,Y-10);c.lineTo(X+13,Y-10);c.lineTo(X,Y+13);c.fill();
      r(X-13,Y-13,26,4,'#c8742a');r(X-6,Y-6,3,3,'#c8372d');r(X+2,Y-1,3,3,'#c8372d');r(X-2,Y+4,2,2,'#6aa84f')}
    c.font=`800 6.5px ${UIF}`;c.textAlign='left';
    for(const b of a.bub){const lines=wrap(c,b.q,48),h=lines.length*8+6,sx=b.who?107:53;
      c.fillStyle='#0d0a14';c.beginPath();c.moveTo(sx,46);c.lineTo(b.x+20,b.y+h-1);c.lineTo(b.x+30,b.y+h-1);c.fill();
      r(b.x-1,b.y-1,54,h+2,'#0d0a14');r(b.x,b.y,52,h,b.ans==='skål'?'#fff1c4':'#fff');
      c.fillStyle='#0d0a14';lines.forEach((l,i)=>c.fillText(l,b.x+3,b.y+9+i*8))}
    c.restore();
    const lid=(1-a.eye)*56;r(0,0,160,lid,'#000');r(0,104-lid,160,lid,'#000');
    r(0,0,160,104,`rgba(0,0,0,${(1-a.eye)*.3})`);
    if(a.snore>0){c.font=`900 15px ${UIF}`;c.fillStyle='#fff';c.textAlign='center';c.fillText('Zzz…',80+Math.sin(T*3)*6,58)}
    r(0,102,160,18,'#1b1420');
    c.font=`900 8px ${UIF}`;c.textAlign='center';
    for(const [k,lab,bx] of BTN){r(bx,104,48,14,k==='skål'?'#d08a1a':k==='ja'?'#3f7a34':'#8e2420');r(bx,104,48,2,'rgba(255,255,255,.25)');c.fillStyle='#fff';c.fillText(lab,bx+24,114)}
    r(4,4,42,6,'#0d0a14');r(5,5,40*a.eye,4,a.eye>.35?'#9bc53d':'#e0483e');
    timebar(a,r,0);
  }
};

/* ---------- Jacuzzi: damp, bobler og nødder ---------- */
N.MSK.jacuzzi={kind:'custom',title:'Jacuzzi-damp',
  help:'Tryk hurtigt for mere damp, langsomt for mindre. Hold hende i syne, og hold Egern Man varm. Pop boblerne med nødder i.',
  init(a){a.dur=16;a.heat=.5;a.good=0;a.gT=2;a.lo=.4;a.hi=.58;a.msgT=0;a.bub=[];a.nuts=[];a.nT=2;a.got=0;a.fly=[]},
  update(a,dt){
    const score=()=>clamp(75*a.good/a.dur+a.got*6,0,100);
    if(a.pt>=a.dur){N.mgFinish(Math.round(score()));return}
    a.heat-=dt*(.1+.05*Math.sin(a.pt*1.9)+a.pt*.005);
    a.gT-=dt;if(a.gT<=0){a.gT=1.8+rnd()*1.7;const up=rnd()<.5;a.heat+=up?.18:-.17;a.msgT=1.1;
      $('#mgmsg').textContent=up?'Boblerne går amok!':'Nogen åbnede terrassedøren!';up?tone('sine',300,600,.3,.06):tone('sine',500,200,.3,.06)}
    a.heat=clamp(a.heat,0,1);if(a.heat>=a.lo&&a.heat<=a.hi)a.good+=dt;
    if(a.msgT>0)a.msgT-=dt;else $('#mgmsg').textContent=a.heat>a.hi?'For meget damp! Du kan ikke se hende.':a.heat<a.lo?'Egern Man fryser! Squeak!':'Perfekt. Hun kigger stadig.';
    if(rnd()<a.heat*dt*40)a.bub.push({x:18+rnd()*124,y:100,v:10+rnd()*22,life:1});
    for(const b of a.bub){b.y-=b.v*dt;b.life-=dt*1.4}a.bub=a.bub.filter(b=>b.life>0);
    a.nT-=dt;if(a.nT<=0){a.nT=2.4+rnd()*1.6;a.nuts.push({x:46+rnd()*70,y:98,ph:rnd()*6})}
    for(const n of a.nuts){n.ph+=dt;n.y-=17*dt;n.x+=Math.sin(n.ph*3)*12*dt}a.nuts=a.nuts.filter(n=>n.y>-10&&!n.pop);
    for(const f of a.fly){f.t+=dt*2.2}a.fly=a.fly.filter(f=>f.t<1);
    pts(score());
  },
  tap(a,x,y){
    const n=a.nuts.find(n=>Math.hypot(n.x-x,n.y-y)<11);
    if(n){n.pop=true;a.got++;a.fly.push({x:n.x,y:n.y,t:0});sfx.squeak();$('#mgmsg').textContent='Nød! Egern Man er lykkelig.';a.msgT=.9;return}
    a.heat=Math.min(1,a.heat+.06);tone('sine',500+rnd()*400,900,.06,.05);
  },
  draw(a,c,r,T){
    r(0,0,160,120,'#123040');for(let y=0;y<64;y+=10)for(let x=(y/10%2)*5;x<160;x+=10)r(x,y,9,9,'#18404f');
    r(30,4,100,40,'#0b1a26');r(30,4,100,2,'#5a8aa0');for(let i=0;i<8;i++)r(34+((i*29)%92),8+((i*13)%30),1,1,'#fff');
    r(6,58,148,62,'#d8d4cc');r(10,62,140,54,'#2fa0b8');r(10,62,140,3,'#7fe0e8');
    // hende, venstre side
    const sx=42,sy=64,K='#04070b';c.fillStyle=K;c.beginPath();c.arc(sx,sy-20,4,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(sx,sy-11,6.5,8,0,0,Math.PI*2);c.fill();
    c.beginPath();c.moveTo(sx-15,sy+8);c.quadraticCurveTo(sx-14,sy-2,sx,sy-3);c.quadraticCurveTo(sx+14,sy-2,sx+15,sy+8);c.fill();
    const gl=.55+.45*Math.sin(T*3);c.strokeStyle=`rgba(210,235,255,${gl})`;c.lineWidth=1;c.strokeRect(sx-6,sy-13,5,3);c.strokeRect(sx+1,sy-13,5,3);
    // Egern Man, højre side
    const cold=a.heat<a.lo,sh=cold?((T*30|0)%2):0;c.drawImage(N.portrait('egern'),102+sh,44,32,32);if(cold)r(102,44,32,30,'rgba(120,170,255,.28)');
    r(10,72,140,44,'rgba(47,160,184,.93)');r(10,72,140,1,'#9fe8f0');
    for(const b of a.bub){c.fillStyle=`rgba(255,255,255,${b.life})`;c.fillRect(b.x|0,b.y|0,2,2)}
    // damp
    const st=sm(.3,.85,a.heat);
    for(let i=0;i<16;i++){c.fillStyle=`rgba(232,242,246,${st*.6})`;c.beginPath();c.arc(8+((i*37+T*6)%130),10+((i*19)%66)+Math.sin(T*.5+i*1.7)*4,12+((i*7)%10),0,Math.PI*2);c.fill()}
    // nød-bobler
    for(const n of a.nuts){c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.2;c.beginPath();c.arc(n.x,n.y,8,0,Math.PI*2);c.stroke();c.fillStyle='rgba(200,240,255,.25)';c.fill();

/* ---------- Månekage-boss ---------- */
function updBoss(dt){
  const s=S,B=s.boss,p=s.p;if(B.dead)return;
  B.t+=dt;if(B.hurt>0)B.hurt-=dt;
  if(B.frz>0){B.frz-=dt;return}
  const low=B.hp<=B.max/2,ease=(a,b,k)=>a+(b-a)*Math.min(1,dt*k);
  switch(B.st){
    case 'intro':B.sx=ease(B.sx,9.5,2);B.cy=10.5+Math.sin(B.t*2)*.3;break;
    case 'float':B.sx=ease(B.sx,9.5,3);B.cy=10.3+Math.sin(B.t*2.2)*.5;B.shootT-=dt;
      if(B.shootT<=0){B.shots++;B.shootT=low?1.05:1.45;const hi=rnd()<.45;
        s.orbs.push({x:s.cam+B.sx-.8,y:B.cy,ty:hi?12.3:13.55});
        if(low&&rnd()<.4)s.orbs.push({x:s.cam+B.sx+.6,y:B.cy,ty:hi?13.55:12.3});
        sfx.pop();if(rnd()<.3)say(pick(['Lotuspasta!','Spis mig, hvis I tør!','Mere fyld!','Månen er MIN!']));
        if(B.shots>=(low?5:4)){B.shots=0;B.st='slam';B.t=0}}
      break;
    case 'slam':B.sx=ease(B.sx,7.5,4);B.cy=ease(B.cy,13,6);if(B.t>.7){B.st='roll';B.t=0;s.shake=.35;sfx.crash()}break;
    case 'roll':B.sx-=(low?3.4:2.6)*dt;B.cy=13;B.rot-=dt*5;if(B.sx<-3){B.st='return';B.t=0}break;
    case 'return':B.sx=ease(B.sx,9.5,1.6);B.cy=ease(B.cy,10.4,2);B.rot*=.9;if(B.t>1.6){B.st='float';B.t=0;B.shootT=1}break;
  }
  if(s.dead>0)return;
  const bx=s.cam+B.sx,pcx=p.x,pcy=p.y-p.h/2;
  if(Math.hypot(bx-pcx,B.cy-pcy)<1.35&&B.st!=='return'){
    if(B.st==='roll'&&p.vy>0&&p.y<B.cy-.35){hitBoss();p.vy=-13;B.st='return';B.t=0}
    else hurt();
  }
  for(const o of s.orbs){o.y+=(o.ty-o.y)*Math.min(1,dt*5);o.x-=2.6*dt;if(Math.hypot(o.x-pcx,o.y-pcy)<.62){o.dead=true;hurt()}if(o.x<s.cam-2)o.dead=true}
  s.orbs=s.orbs.filter(o=>!o.dead);
}

function hitBoss(){
  const s=S,B=s.boss;if(B.hurt>0||B.dead)return;
  B.hp--;B.hurt=.8;sfx.hit();burst(s.cam+B.sx,B.cy,'#dca24c',14);pop(s.cam+B.sx,B.cy-1.4,'-1','#ffb3a8');N.addScore(40);
  $('#bosshp').style.width=Math.max(0,B.hp/B.max*100)+'%';

    for(let i=0;i<10;i++)setTimeout(()=>{if(S===s)burst(s.cam+B.sx+(rnd()-.5)*2,B.cy+(rnd()-.5)*2,pick(['#c98a3a','#dca24c','#fff']),12)},i*110);

 [['caesar','…'],['caesar','Tommel op.'],['caesar','Velkommen til den virkelige verden.'],['speaker','Launch om 32 sekunder. Sporene skifter mellem tre, to og ét. Raketten venter ikke.'],['neck','Og alle kollegerne har spørgsmål. Selvfølgelig har de det.']],
];
const HELP={
 martin:{name:'Illumartin',msg:'Lumen-Master! Nu kan vi se fremtiden.'},
 egern:{name:'Egern Man',msg:'Squeak! Nøddemagnet! Al osten er min. Og jeres.'},
 eivind:{name:'Eivind',msg:'PUBG-RASERI! Jeg smadrer alt!'},
 don:{name:'The Don',msg:'Hold fast. Nu springer vi over alt.'},
 cstar:{name:'C Star',msg:'Jeg har hacket to ekstra spor. Ingen forhindringer derude.'},
};

/* ---------- tilstand ---------- */
let R=null;
function newRun(zi,endless,total){return {zi,endless,total:total||0,dist:0,objs:[],next:28,lane:0,lx:0,jy:0,jv:0,slide:0,inv:0,slow:0,
  hp:3,t:0,go:false,done:false,cut:0,dp:0,coins:0,smash:0,fog:0,magnet:0,rage:0,mega:0,hack:0,zip:0,helperOn:null,helperT:0,hs1:false,hs2:false,
  vote:null,mode:null,gateN:0,nextGate:40,cd:32,parts:[],pops:[],shake:0,sw:null,hudT:0,escore:0,banner:null,ideas:[...IDEAS].sort(()=>rnd()-.5)}}
const zone=()=>Z[R.zi];
/* Launch: sporene flytter sig rundt (antal, midte) i stedet for at snævre ind */
const LSEQ=[[3,0],[2,-1],[1,1.5],[4,0],[2,1],[1,-1.5],[3,.5],[2,-.5],[3,-.5]];
const cfg=pos=>{const z=zone();if(z.launch){if(pos>z.len-70||pos<0)return [3,0];return LSEQ[Math.floor(pos/90)%LSEQ.length]}return [z.lanes,0]};
const nAt=pos=>cfg(pos)[0],cOf=pos=>cfg(pos)[1];
const lanesAt=pos=>{const [n,c]=cfg(pos);return centers(n).map(l=>l+c)};
const bounds=pos=>{const [n,c]=cfg(pos),h=(n-1)/2+(R.hack>0?1:0);return [c-h,c+h]};
const centers=n=>{const a=[];for(let i=0;i<n;i++)a.push(i-(n-1)/2);return a};
function speed(){if(R.endless)return Math.min(34,12+R.total*.0045);return 11+R.zi*2.2+R.dist*.004}

/* ---------- spawning ---------- */
function add(pos,lane,kind,extra){R.objs.push(Object.assign({pos,lane,kind,brand:pick(BRANDS),q:pick(QUESTIONS)},extra||{}))}
function coinsLine(pos,lane,n,air){for(let i=0;i<n;i++)add(pos+i*3,lane,'coin',{air})}
function rowAt(pos,pat){
  const n=nAt(pos),c0=cOf(pos),L=lanesAt(pos),f=pick(L),others=L.filter(l=>l!==f);
  if(R.hack>0){const h=(n-1)/2+1;coinsLine(pos,c0-h,3);coinsLine(pos,c0+h,3)}
  if(n===1&&['one','two','mix'].includes(pat))pat=pick(['low','high','coins']);
  switch(pat){
    case 'one':add(pos,pick(L),'block');coinsLine(pos-4,f,4);break;
    case 'two':others.forEach(l=>add(pos,l,'block'));coinsLine(pos-3,f,4);break;
    case 'low':L.forEach(l=>add(pos,l,'low'));coinsLine(pos-1,f,3,true);break;
    case 'high':L.forEach(l=>add(pos,l,'high'));break;
    case 'mix':{const ks=L.map(()=>pick(['low','high','block']));if(ks.every(k=>k==='block'))ks[(rnd()*ks.length)|0]='low';L.forEach((l,i)=>add(pos,l,ks[i]));break}
    case 'coins':coinsLine(pos,f,6);break;
  }
}
function spawnRow(pos){
  const z=zone();
  if(!R.endless&&pos>z.len-(z.launch?40:12))return 14;
  if(z.caesar)return 14;
  if(z.helper&&!R.hs1&&pos>z.len*.28){R.hs1=true;add(pos,pick(lanesAt(pos)),'helper');return 14}
  if(z.helper&&!R.hs2&&pos>z.len*.66){R.hs2=true;add(pos,pick(lanesAt(pos)),'helper');return 14}
  if(R.zi>0&&rnd()<.12&&cfg(pos).join()===cfg(pos+60).join()){add(pos,cOf(pos),'hook');for(let k=1;k<=4;k++)rowAt(pos+k*12,pick(['mix','two','mix']));coinsLine(pos+6,cOf(pos),10,true);return 62}
  rowAt(pos,pick(['one','two','low','high','mix','coins','one','two']));
  return clamp(24-R.zi*1.8-(R.endless?R.total*.002:R.dist*.006),11,24)*(.85+rnd()*.3);
}
/* Cæsars idéporte */
function placeGate(pos){const pair=R.ideas[R.gateN%R.ideas.length];R.gateN++;const good=rnd()<.5?-.5:.5;add(pos,0,'gate',{good,pair})}
function resolveGate(o){
  const good=Math.abs(R.lx-o.good)<.5;R.mode=good?'gold':'lions';R.vote={down:!good,t:1.8};
  const nxt=o.pos+115;R.objs=R.objs.filter(q=>q===o||q.pos<o.pos+4||q.kind==='helper');
  if(good){addPts(25);sfx.win();N.toast('<b>Cæsar:</b> Tommel op! Det regner med guld frem til næste idé.',2200,'pts')}
  else{sfx.boss();N.toast(o.pair[1].includes('ost')?'<b>Cæsar:</b> Tommel ned! <b>Neck Cheese Man:</b> Men… de var af ost!':'<b>Cæsar:</b> Tommel ned! Slip løverne løs!',2400)}
  for(let p=o.pos+12;p<nxt-10;p+=good?3:14){
    if(good){[-.5,.5].forEach(l=>add(p,l,'coin'));if(rnd()<.12)add(p+1.5,pick([-.5,.5]),'low')}
    else{const l=pick([-.5,.5]);add(p,l,'block',{lion:true});add(p-5,-l,'coin')}}
  if(R.gateN===1||R.gateN===3)add(o.pos+50,pick([-.5,.5]),'helper');
  if(nxt<zone().len-20||R.endless)placeGate(nxt);
}

/* ---------- handlinger ---------- */
function act(a){
  const r=R;if(!r||!r.go||r.done)return;const [lo,hi]=bounds(r.dist);
  if(a==='left'&&r.lane>lo+.01){r.lane--;tone('square',500,420,.05,.04)}
  else if(a==='right'&&r.lane<hi-.01){r.lane++;tone('square',420,500,.05,.04)}
  else if(a==='up'){
    const hk=r.objs.find(o=>o.kind==='hook'&&!o.used&&o.pos-r.dist<4&&o.pos-r.dist>-2);
    if(hk&&r.zip<=0){hk.used=true;r.zip=56;r.jv=0;sfx.swing();pop('Ostereb!','#f6c431');return}
    if(r.jy<=.02&&r.zip<=0){r.jv=r.mega>0?14:9.6;r.slide=0;tone('square',380,r.mega>0?1200:760,.12,.05)}
  }
  else if(a==='down'&&r.zip<=0){r.slide=.62;if(r.jy>0)r.jv=-14;tone('square',300,160,.08,.04)}
}
function activateHelper(id){
  const r=R,h=HELP[id];r.helperOn=id;r.helperT=10;sfx.pling();N.toast(`<b>${h.name}:</b> ${h.msg}`,2600);
  if(id==='martin'){r.fog=12;r.helperT=12}else if(id==='egern')r.magnet=10;else if(id==='eivind'){r.rage=8;r.helperT=8}
  else if(id==='don'){r.mega=9;r.helperT=9}else if(id==='cstar'){r.hack=10}
}
function hit(o){
  const r=R;o.hit=true;
  if(r.rage>0||r.zip>0){smash(o);return}
  if(r.inv>0)return;
  r.hp--;G.hp=r.hp;N.renderHearts();r.inv=1.3;r.slow=zone().launch?1.4:.9;r.shake=.35;sfx.hurt();
  for(let i=0;i<10;i++)r.parts.push({x:.5,y:.6,vx:(rnd()-.5)*1.6,vy:-rnd()*1.4,life:.6,col:'#e0483e'});
  if(r.hp<=0)fail();
}
function smash(o){o.gone=true;R.smash++;addPts(10);sfx.pop();R.shake=.15;for(let i=0;i<8;i++)R.parts.push({x:.5,y:.4,vx:(rnd()-.5)*2,vy:-rnd()*1.6,life:.5,col:'#f6c431'})}
function addPts(n){if(R.endless)R.escore+=n;else G.score+=n;$('#score').textContent=fmt(R.endless?R.escore:G.score)}
function coin(o){o.gone=true;R.coins++;addPts(5);tone('triangle',990,1320,.06,.05)}
function pop(t,col){R.pops.push({t,col,life:1.2})}

/* ---------- opdatering ---------- */
function update(dt){
  const r=R;if(!r)return;r.t+=dt;fx(dt);
  if(r.done){if(r.cut>0)cutscene(dt);return}
  if(!r.go)return;
  const z=zone();
  let v=speed();if(r.slow>0){r.slow-=dt;v*=.5}
  r.dist+=v*dt;r.total+=v*dt;r.dp+=v*dt;while(r.dp>=10){r.dp-=10;addPts(1)}
  // spor-tragt: hold spilleren på et gyldigt spor
  const [lo,hi]=bounds(r.dist);let L=Math.round(r.lane-lo)+lo;L=clamp(L,lo,hi);if(L!==r.lane){r.lane=L;r.inv=Math.max(r.inv,.4)}
  r.lx+=(r.lane-r.lx)*Math.min(1,dt*14);
  if(r.zip>0){r.zip-=v*dt;r.jy+=(2.2-r.jy)*Math.min(1,dt*8);if(r.zip<=0){r.jv=0}}
  else if(r.jy>0||r.jv>0){r.jv-=28*dt;r.jy+=r.jv*dt;if(r.jy<=0){r.jy=0;r.jv=0}}
  if(r.slide>0)r.slide-=dt;if(r.inv>0)r.inv-=dt;
  for(const k of ['fog','magnet','rage','mega','hack'])if(r[k]>0)r[k]-=dt;
  if(r.helperT>0){r.helperT-=dt;if(r.helperT<=0)r.helperOn=null}
  while(r.next<r.dist+95)r.next+=spawnRow(r.next);
  if(z.caesar&&!r.gatePlaced){r.gatePlaced=true;placeGate(r.dist+40)}
  if(r.vote){r.vote.t-=dt;if(r.vote.t<=0)r.vote=null}
  if(z.launch&&!r.endless){r.cd-=dt;if(r.cd<=0){r.cd=0;launchFail();return}}
  for(const o of r.objs){
    if(o.gone||o.hit)continue;const dz=o.pos-r.dist;
    if(o.kind==='gate'){if(dz<.3){o.gone=true;resolveGate(o)}continue}
    if(o.kind==='hook'){if(dz<-3)o.gone=true;continue}
    if(o.kind==='coin'&&r.magnet>0&&dz<2&&dz>-1){coin(o);continue}
    if(dz<.9&&dz>-.6&&Math.abs(o.lane-r.lx)<.55){
      if(o.kind==='coin'){if(!o.air||r.jy>.5)coin(o)}
      else if(o.kind==='helper'){o.gone=true;activateHelper(z.helper==='comp'?comp():z.helper)}
      else if(o.kind==='low'){if(r.jy<.55)hit(o)}
      else if(o.kind==='high'){if(r.slide<=0&&r.jy<2)hit(o)}
      else if(r.jy<2)hit(o);
    }
  }
  r.objs=r.objs.filter(o=>!o.gone&&o.pos-r.dist>-4);
  if(r.dist>=z.len){
    if(r.endless){r.zi=(r.zi+1)%4;r.dist=0;r.objs=[];r.next=26;r.hs1=r.hs2=false;r.gatePlaced=false;r.mode=null;r.banner={t:zone().name,life:2.2};sfx.pling()}
    else if(z.launch){r.done=true;r.cut=.01;sfx.win()}
    else zoneDone();
  }
  hud(dt);
}
function fx(dt){const r=R;for(const p of r.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=3*dt}r.parts=r.parts.filter(p=>p.life>0);
  for(const p of r.pops)p.life-=dt;r.pops=r.pops.filter(p=>p.life>0);if(r.shake>0)r.shake-=dt;if(r.banner){r.banner.life-=dt;if(r.banner.life<=0)r.banner=null}}
function hud(dt){const r=R;r.hudT-=dt;if(r.hudT>0)return;r.hudT=.2;const z=zone(),n=nAt(r.dist);let g;
  if(r.endless)g=`Endless · <b>${Math.floor(r.total)} m</b> · ${z.name} · ${n} spor`;
  else if(z.launch)g=`Raketten letter om <b>${Math.ceil(r.cd)} sek</b> · ${Math.max(0,Math.ceil(z.len-r.dist))} m`;
  else g=`${z.name} · ${n} spor · <b>${Math.min(100,Math.floor(r.dist/z.len*100))}%</b>`;
  const el=$('#goal');if(el.innerHTML!==g)el.innerHTML=g;el.classList.toggle('urgent',!!(z.launch&&!r.endless&&r.cd<10))}

/* ---------- forløb ---------- */
function begin(zi,opts){
  opts=opts||{};G.mode='a3';G.maxhp=3;G.hp=3;
  R=newRun(zi,!!opts.endless,0);
  N.showHud(true);$('#abil').innerHTML='';$('#bossbar').hidden=true;N.renderHearts();
  $('#lvlname').textContent=R.endless?'Akt 3 · Endless-løb':`Akt 3 · ${zi+1}/5 · ${Z[zi].name}`;
  $('#score').textContent=fmt(R.endless?0:G.score);$('#goal').classList.remove('urgent','wrap');
  if(!R.endless)N.saveProg('3',zi);
  G.state='play';requestAnimationFrame(N.measureHud);
  let lines=opts.skip||R.endless?[]:INTRO[zi];
  if(!opts.skip&&zi===0&&!R.endless&&opts.fresh)lines=[['neck','Portalen sendte os… ind i et mødelokale?'],['speaker','Velkommen til Stage-Gate. Første punkt på dagsordenen: Foresight.']].concat(lines);
  const go=()=>{R.go=true;R.tut=zi===0||R.endless?7:0};
  if(lines.length)N.dialog(lines,go);else go();
  hud(1);
}
function zoneDone(){const r=R;r.go=false;N.addScore(150);N.toast(`${zone().name} klaret! <b>+150</b> point`,2200,'pts');N.dialog(OUTRO[r.zi],()=>begin(r.zi+1))}
function fail(){
  const r=R;r.go=false;if(r.endless){endless();return}
  N.dialog([['neck',pick(['Det møde gik ikke helt efter planen.','Jeg skal lige have et øjeblik.','Kan vi tage den igen fra toppen?'])]],()=>{N.addScore(-50);N.toast('Mødet starter forfra · <b>−50</b> point',2200);G.stats.falls++;begin(r.zi,{skip:true})});
}
function launchFail(){R.go=false;N.dialog([['speaker','Raketten lettede uden dig. Heldigvis har vi en reserveraket.'],['neck','Én gang til.']],()=>{N.addScore(-50);begin(4,{skip:true})})}
function cutscene(dt){
  const r=R;r.cut+=dt;
  if(r.cut>.2&&!r.cs1){r.cs1=true;$('#goal').innerHTML='<b>3… 2… 1…</b>'}
  if(r.cut>1.6&&!r.cs2){r.cs2=true;sfx.crash();sfx.portal();r.shake=1.5}
  if(r.cut>4.2&&!r.cs3){r.cs3=true;finale()}
}
function finale(){

  N.screen(`<div class="card"><span class="eyebrow">Launch gennemført</span><h2>Velkommen til den virkelige verden</h2>
    <div class="row"><canvas data-p="neck" width="32" height="32"></canvas><canvas data-p="egern" width="32" height="32"></canvas><canvas data-p="martin" width="32" height="32"></canvas><canvas data-p="eivind" width="32" height="32"></canvas><canvas data-p="${comp()}" width="32" height="32"></canvas></div>
    <p>Alle produkter er live. Raketten er på vej. Fortsættelse følger… måske.</p>
    <div class="stats"><span>Rang</span><b>${rk}</b><span>Tid</span><b>${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</b><span>Turds besejret</span><b>${G.stats.kills}</b><span>Minispil spillet</span><b>${G.stats.games}</b><span>Besvimelser</span><b>${G.stats.falls}</b><span class="tot">Point</span><b class="tot">${fmt(sc)}</b></div>
    <p class="rec">${rec?'Ny rekord!':'Rekord: '+fmt(Math.max(old,sc))+' point'}</p>
    <p class="share" id="sharetxt" hidden>${txt}</p>
    <div class="btns"><button class="px main" data-act="a3share">Del din score</button><button class="px act" data-act="endless">Endless-løb<small>NU LÅST OP</small></button><button class="px alt" data-act="title">Til forsiden</button></div></div>`);
  N.ACT.a3share=()=>share(txt);
}
function endless(){
  N.showHud(false);G.state='win';
  const sc=Math.round(R.escore),m=Math.floor(R.total),old=parseInt(store.get('ncm_endless','0'),10)||0,rec=sc>old;if(rec)store.set('ncm_endless',sc);
  const txt=`Jeg løb ${m} m og fik ${fmt(sc)} point i Neck Cheese Man Endless. Kan du slå det?`;
  N.screen(`<div class="card"><span class="eyebrow">Endless-løb</span><h2>${rec?'Ny rekord!':'Mødet er slut'}</h2>
    <div class="stats"><span>Distance</span><b>${m} m</b><span>Ost samlet</span><b>${R.coins}</b><span>Smadret</span><b>${R.smash}</b><span class="tot">Point</span><b class="tot">${fmt(sc)}</b></div>
    <p class="rec">Rekord: ${fmt(Math.max(sc,old))} point</p><p class="share" id="sharetxt" hidden>${txt}</p>
    <div class="btns"><button class="px main" data-act="endless">Løb igen</button><button class="px act" data-act="a3share">Del din score</button><button class="px alt" data-act="title">Til forsiden</button></div></div>`);
  N.ACT.a3share=()=>share(txt);
}
function share(txt){
  const show=()=>{const el=$('#sharetxt');if(el){el.hidden=false;const s=getSelection(),rg=document.createRange();rg.selectNodeContents(el);s.removeAllRanges();s.addRange(rg)}};
  const copy=()=>{try{navigator.clipboard.writeText(txt).then(()=>N.toast('Kopieret. Sæt den ind i gruppechatten.',2400,'pts'),show)}catch(e){show()}};
  if(navigator.share)navigator.share({text:txt}).catch(err=>{if(!err||err.name!=='AbortError')copy()});else copy();
}

/* ---------- tegning ---------- */
const F=7;
function render(){
  const Wp=cv.width,Hp=cv.height,c=ctx;c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;
  const r=R;if(!r){c.fillStyle='#0d0a14';c.fillRect(0,0,Wp,Hp);return}
  const z=zone(),dpr=N.dpr();
  if(!r.topPx||r.t%1<.02){const gb=$('#goal');r.topPx=(gb&&!gb.hidden?gb.getBoundingClientRect().bottom:70)*dpr}
  const hy=Math.round(Math.max(r.topPx+Hp*.05,Hp*.27)),by=Math.round(Hp*.88),LW=Wp*.18;
  let sx=0,sy=0;if(r.shake>0){sx=(rnd()-.5)*14*dpr;sy=(rnd()-.5)*14*dpr}
  c.translate(sx,sy);
  const gr=c.createLinearGradient(0,0,0,hy);gr.addColorStop(0,z.sky[0]);gr.addColorStop(1,z.sky[1]);c.fillStyle=gr;c.fillRect(-20,-20,Wp+40,hy+20);
  c.fillStyle=z.side;c.fillRect(-20,hy,Wp+40,Hp-hy+20);
  horizon(z,Wp,hy,r);
  const Y=d=>hy+(by-hy)*F/(d+F),S=d=>F/(d+F),X=(l,d)=>Wp/2+l*LW*S(d);
  const far=110,hk=r.hack>0;
  for(let d=far;d>-1.5;d-=1.5){
    const d2=Math.max(d-1.5,-1.4),y1=Y(d),y2=Y(d2),n=nAt(r.dist+d),cc=cOf(r.dist+d),C1=Wp/2+cc*LW*S(d),C2=Wp/2+cc*LW*S(d2),h1=n/2*LW*S(d),h2=n/2*LW*S(d2),band=Math.floor((r.dist+d)/5)%2;
    if(hk){const e1=h1+LW*S(d),e2=h2+LW*S(d2);c.fillStyle=band?'rgba(91,192,255,.45)':'rgba(91,192,255,.3)';c.beginPath();c.moveTo(C1-e1,y1);c.lineTo(C1+e1,y1);c.lineTo(C2+e2,y2+1);c.lineTo(C2-e2,y2+1);c.fill()}
    c.fillStyle=band?z.road:z.road2;c.beginPath();c.moveTo(C1-h1,y1);c.lineTo(C1+h1,y1);c.lineTo(C2+h2,y2+1);c.lineTo(C2-h2,y2+1);c.fill();
    const lw=Math.max(1.5,LW*.03*S(d));
    if(Math.floor((r.dist+d)/3)%2){c.fillStyle='rgba(255,255,255,.2)';for(let k=1;k<n;k++){const o=-n/2+k;c.fillRect(C1+o*LW*S(d)-lw/2,y1,lw,y2-y1+1)}}
    c.fillStyle=z.edge;c.fillRect(C1-h1-lw*1.5,y1,lw*3,y2-y1+1);c.fillRect(C1+h1-lw*1.5,y1,lw*3,y2-y1+1);
  }
  for(let k=Math.ceil(r.dist/12)*12;k<r.dist+far;k+=12){const d=k-r.dist,s=S(d),n=nAt(k),cc=cOf(k);for(const side of [-1,1]){const x=Wp/2+(cc+side*(n/2+.45+(hk?1:0)))*LW*s,y=Y(d),h=LW*1.6*s,w=Math.max(2,LW*.1*s);
    c.fillStyle=z.key==='gold'?'#e8d8b0':z.key==='silver'?'#c4ccd4':'#3a2a4a';c.fillRect(x-w/2,y-h,w,h);
    c.fillStyle=z.key==='foresight'?'#ffd27a':z.key==='bronze'?'#fff2a0':z.key==='launch'?'#ff5a5a':z.edge;c.fillRect(x-w,y-h-w*1.4,w*2,w*1.4)}}
  const list=r.objs.filter(o=>!o.gone&&o.pos-r.dist<far&&o.pos-r.dist>-1.4).sort((a,b)=>b.pos-a.pos);
  if(z.launch&&!r.endless){const d=z.len+6-r.dist;if(d<far&&d>-1){const s=S(d),w=LW*2*s,h=w*2,lift=r.cut>1.6?(r.cut-1.6)**2*Hp*.25:0;c.drawImage(SP.rocket,Wp/2-w/2,Y(d)-h-lift,w,h);
    if(r.cut>1.6){c.fillStyle=((r.t*20)|0)%2?'#f6c431':'#ff7a3a';c.fillRect(Wp/2-w*.2,Y(d)-lift,w*.4,w*.8)}}}
  for(const o of list)drawObj(o,X(o.lane,o.pos-r.dist),Y(o.pos-r.dist),LW*S(o.pos-r.dist),z,r,S(o.pos-r.dist));
  if(z.fog&&r.fog<=0){c.fillStyle='rgba(4,0,12,.5)';c.fillRect(-20,hy,Wp+40,Hp-hy+20);const fy=Y(13);const g2=c.createLinearGradient(0,hy,0,fy);g2.addColorStop(0,'rgba(30,12,50,.98)');g2.addColorStop(.8,'rgba(30,12,50,.93)');g2.addColorStop(1,'rgba(30,12,50,0)');c.fillStyle=g2;c.fillRect(-20,hy-2,Wp+40,fy-hy+2)}
  else if(z.fog){const g3=c.createRadialGradient(Wp/2,by,LW*.5,Wp/2,by,Hp*.7);g3.addColorStop(0,'rgba(255,230,140,.18)');g3.addColorStop(1,'rgba(255,230,140,0)');c.fillStyle=g3;c.fillRect(0,0,Wp,Hp)}
  if(!(r.cut>.6)){
    const px=Wp/2+r.lx*LW,u=Wp*.16,run=r.jy>0?0:(((r.t*10)|0)%2)*u*.04,jy=r.jy*LW*.8;
    c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(px,by,u*.42,u*.1,0,0,Math.PI*2);c.fill();
    if(r.zip>0){c.strokeStyle='#f6c431';c.lineWidth=4*dpr;c.beginPath();c.moveTo(px,hy);c.lineTo(px,by-u-jy+u*.1);c.stroke()}
    if(!(r.inv>0&&((r.t*14)|0)%2)){if(r.slide>0)c.drawImage(N.SPR.neck,px-u*.55,by-u*.55,u*1.1,u*.55);else c.drawImage(N.SPR.neck,px-u/2,by-u-jy-run,u,u)}
    if(r.mega>0){c.strokeStyle='rgba(246,196,49,.8)';c.lineWidth=3*dpr;c.beginPath();c.ellipse(px,by-2,u*.5,u*.13,0,0,Math.PI*2);c.stroke()}
    if(r.rage>0){c.fillStyle='rgba(224,72,62,.25)';c.beginPath();c.arc(px,by-u*.5-jy,u*.75,0,Math.PI*2);c.fill()}
    if(r.helperOn){const hid=r.helperOn,hx=px+(r.lx<.5?u*.95:-u*.95),hu=u*.7;c.drawImage(hid==='eivind'?N.SPR.eivindA:N.SPR[hid],hx-hu/2,by-hu-((r.t*8|0)%2)*hu*.05,hu,hu)}
    for(const p of r.parts){c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle=p.col;c.fillRect(px+(p.x-.5)*u*2,by-u*.5-jy+(p.y-.5)*u*2,u*.08,u*.08)}c.globalAlpha=1;
  } else if(r.cut<4.2){const k=clamp(1-(r.cut-.2)/.6,0,1),u=Wp*.16*k;if(u>2)c.drawImage(N.SPR.neck,Wp/2-u/2,by-u-(1-k)*LW,u,u)}
  c.setTransform(1,0,0,1,0,0);
  const fs=Math.round(Wp*.05);c.textAlign='center';c.lineWidth=fs*.18;c.strokeStyle='#0d0a14';
  if(z.caesar)gatePanels(Wp,hy,fs,r);
  r.pops.forEach((p,i)=>{c.globalAlpha=clamp(p.life*1.5,0,1);c.font=`900 ${fs*.8}px ${UIF}`;const yy=by-Wp*.3-(1.2-p.life)*fs*2-i*fs;c.strokeText(p.t,Wp/2,yy);c.fillStyle=p.col;c.fillText(p.t,Wp/2,yy)});c.globalAlpha=1;
  if(r.banner){c.globalAlpha=clamp(r.banner.life,0,1);c.font=`900 ${fs*1.1}px ${UIF}`;c.strokeText(r.banner.t.toUpperCase(),Wp/2,hy+fs*2.4);c.fillStyle='#f6c431';c.fillText(r.banner.t.toUpperCase(),Wp/2,hy+fs*2.4);c.globalAlpha=1}
  if(r.go&&r.tut>0){r.tut-=1/60;c.globalAlpha=clamp(r.tut,0,1);c.font=`800 ${fs*.62}px ${UIF}`;['Swipe ← → for at skifte spor','Swipe ↑ for at hoppe · ↓ for at dukke dig'].forEach((t,i)=>{const yy=by-Wp*.42+i*fs*.9;c.strokeText(t,Wp/2,yy);c.fillStyle='#fff';c.fillText(t,Wp/2,yy)});c.globalAlpha=1}
}
function gatePanels(Wp,hy,fs,r){
  const g=r.objs.find(o=>o.kind==='gate'&&!o.gone&&o.pos-r.dist<85);if(!g)return;
  const c=ctx,w=Wp*.44,y=hy+fs*.6,f=Math.round(fs*.58);c.font=`800 ${f}px ${UIF}`;
  [-.5,.5].forEach(l=>{const txt=l===g.good?g.pair[0]:g.pair[1],x=Wp/2+l*Wp*.48-w/2;
    const words=txt.split(' '),lines=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(c.measureText(t).width>w-f&&cur){lines.push(cur);cur=wd}else cur=t}if(cur)lines.push(cur);
    const h=lines.length*f*1.25+f*.8;c.fillStyle='#1b1420';c.fillRect(x-3,y-3,w+6,h+6);c.fillStyle='#fff4dc';c.fillRect(x,y,w,h);c.fillStyle='#1b1420';c.textAlign='center';
    lines.forEach((t,i)=>c.fillText(t,x+w/2,y+f*1.15+i*f*1.25));c.fillStyle='#d08a1a';c.fillText(l<0?'◀':'▶',x+w/2,y+h+f*1.1)});
}
function horizon(z,Wp,hy,r){
  const c=ctx,u=Wp/160;
  if(z.key==='foresight'||z.key==='launch')for(let i=0;i<40;i++){c.fillStyle='rgba(255,255,255,.8)';c.fillRect(N.hash(i,2)*Wp,N.hash(i,5)*hy*.9,u*.6,u*.6)}
  if(z.key==='foresight'){c.fillStyle='#d8c8f0';c.beginPath();c.arc(Wp*.75,hy*.45,u*10,0,Math.PI*2);c.fill();c.fillStyle=z.sky[0];c.beginPath();c.arc(Wp*.75+u*4,hy*.45-u*2,u*9,0,Math.PI*2);c.fill();
    c.fillStyle='rgba(176,138,255,.5)';c.beginPath();c.arc(Wp*.5,hy-u*8,u*9,0,Math.PI*2);c.fill();c.fillStyle='#5a3a22';c.fillRect(Wp*.5-u*5,hy-u*1.5,u*10,u*1.5)}
  else if(z.key==='bronze'){c.fillStyle='rgba(255,200,120,.8)';c.beginPath();c.arc(Wp*.3,hy*.6,u*12,0,Math.PI*2);c.fill();
    for(let i=0;i<5;i++){const x=Wp*(.15+i*.18),y=hy*(.3+N.hash(i,4)*.4)+Math.sin(r.t+i)*u*2;c.fillStyle='#fff2a0';c.beginPath();c.arc(x,y,u*3,0,Math.PI*2);c.fill();c.fillStyle='#8a8f99';c.fillRect(x-u*1.2,y+u*2.5,u*2.4,u*2)}}
  else if(z.key==='silver'){for(let i=0;i<9;i++){const h=hy*(.15+N.hash(i,8)*.35);c.fillStyle=i%2?'#7a8292':'#8a92a2';c.fillRect(Wp*(i/9),hy-h,Wp/9-u,h)}
    c.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<4;i++){const h=u*(4+i*3);c.fillRect(Wp*.62+i*u*5,hy*.45-h,u*3.5,h)}}
  else if(z.key==='gold'){c.fillStyle='#b88a4a';c.fillRect(0,hy-hy*.32,Wp,hy*.32);c.fillStyle='#7a5a2a';for(let i=0;i<10;i++){c.fillRect(Wp*(i/10)+u*3,hy-hy*.26,u*9,hy*.12);c.fillRect(Wp*(i/10)+u*3,hy-hy*.11,u*9,hy*.11)}
    const cx=Wp/2,cs=u*22,bal=hy-hy*.2;c.fillStyle='#e8d8b0';c.fillRect(cx-cs*.75,bal,cs*1.5,cs*.18);c.drawImage(N.PCACHE.caesar,cx-cs/2,bal-cs*.85,cs,cs);
    if(r.vote){const d=r.vote.down,tx=cx+cs*.95,ty=bal-cs*.5,s=u*3.2;c.fillStyle='#e0b08a';c.fillRect(tx-s,ty-s,s*2,s*2);c.fillRect(tx-s*.4,d?ty+s:ty-s*2.6,s*.8,s*1.6);
      c.font=`900 ${u*7}px ${UIF}`;c.textAlign='center';c.lineWidth=u*1.5;c.strokeStyle='#0d0a14';const t=d?'TOMMEL NED!':'TOMMEL OP!';c.strokeText(t,cx,hy+u*16);c.fillStyle=d?'#ff6a5a':'#f6c431';c.fillText(t,cx,hy+u*16)}}
  else if(z.key==='launch'){c.fillStyle='rgba(255,180,100,.6)';c.beginPath();c.arc(Wp*.5,hy,u*30,Math.PI,0);c.fill();c.fillStyle='#2a3040';c.fillRect(Wp*.5-u*20,hy-u*4,u*40,u*4)}
}
function drawObj(o,x,y,unit,z,r,s){
  const c=ctx,k=z.key;
  if(o.kind==='coin'){const sz=unit*.36,w=sz*Math.max(.15,Math.abs(Math.cos(r.t*5+o.pos))),yy=y-unit*(o.air?1.1:.3)-sz/2;c.drawImage(SP.coin,x-w/2,yy,w,sz);return}
  if(o.kind==='helper'){const id=z.helper==='comp'?comp():z.helper,sz=unit*.8,yy=y-unit*1.1+Math.sin(r.t*4)*unit*.05;c.fillStyle='rgba(255,240,150,.5)';c.beginPath();c.arc(x,yy+sz/2,sz*.62,0,Math.PI*2);c.fill();c.drawImage(N.portrait(id),x-sz/2,yy,sz,sz);return}
  if(o.kind==='hook'){const n=nAt(o.pos),hw=(n/2+.3)*unit,top=y-unit*2.6;c.fillStyle='#555a64';c.fillRect(x-hw,top,hw*2,Math.max(2,unit*.06));
    c.strokeStyle='#f6c431';c.lineWidth=Math.max(2,unit*.08);c.beginPath();c.moveTo(x,top);c.lineTo(x,top+unit*.5);c.stroke();c.beginPath();c.arc(x,top+unit*.7,unit*.2,Math.PI*.1,Math.PI*1.4);c.stroke();
    if(o.pos-r.dist<12&&!o.used){c.font=`900 ${Math.max(10,unit*.25)}px ${UIF}`;c.textAlign='center';c.lineWidth=4;c.strokeStyle='#1b1420';c.strokeText('SWIPE ↑',x,top-unit*.15);c.fillStyle='#fff27a';c.fillText('SWIPE ↑',x,top-unit*.15)}return}
  if(o.kind==='gate'){const n=2;[-.5,.5].forEach(l=>{const gx=Wp2()+l*unit,w=unit*.9,h=unit*1.5;c.fillStyle='#e8d8b0';c.fillRect(gx-w/2,y-h,unit*.08,h);c.fillRect(gx+w/2-unit*.08,y-h,unit*.08,h);
    c.fillStyle='#1b1420';c.fillRect(gx-w/2,y-h,w,unit*.32);c.fillStyle='#fff4dc';c.fillRect(gx-w/2+2,y-h+2,w-4,unit*.32-4);
    if(unit>40){c.fillStyle='#1b1420';c.font=`900 ${unit*.16}px ${UIF}`;c.textAlign='center';c.fillText(l<0?'◀ IDÉ':'IDÉ ▶',gx,y-h+unit*.22)}});return}
  if(o.kind==='low'){const w=unit*.9,h=w*.62;c.drawImage(SP[LOW[k]],x-w/2,y-h,w,h);return}
  if(o.kind==='high'){const [t,c1,c2]=HIGH[k],w=unit*.95,bh=unit*.3,bot=y-unit*.55,pw=Math.max(2,unit*.05);
    c.fillStyle='#3a2a2a';c.fillRect(x-w/2,bot-bh,pw,bh+unit*.55);c.fillRect(x+w/2-pw,bot-bh,pw,bh+unit*.55);c.fillStyle=K;c.fillRect(x-w/2,bot-bh,w,bh);c.fillStyle=c1;c.fillRect(x-w/2+pw,bot-bh+pw,w-pw*2,bh-pw*2);
    if(unit>30){c.fillStyle=c2;c.font=`900 ${Math.max(6,bh*.42)}px ${UIF}`;c.textAlign='center';c.fillText(t,x,bot-bh*.32,w*.9)}return}
  if(o.lion||k==='gold'){const w=unit*.95;c.drawImage(SP.lion,x-w/2,y-w,w,w);return}
  if(k==='launch'){const w=unit*.9;c.drawImage(N.PCACHE.colleague,x-w/2,y-w,w,w);
    if(o.pos-r.dist<38&&unit>26){const fs=Math.max(8,unit*.13);c.font=`800 ${fs}px ${UIF}`;const tw=c.measureText(o.q).width+fs;c.fillStyle='#fff4dc';c.fillRect(x-tw/2,y-w-fs*2,tw,fs*1.6);c.fillStyle=K;c.textAlign='center';c.fillText(o.q,x,y-w-fs*.8)}return}
  const w=unit*.95;c.drawImage(SP[BLOCK[k]],x-w/2,y-w,w,w);
  if(k==='silver'&&unit>24){c.fillStyle=K;c.font=`900 ${Math.max(6,w*.13)}px ${UIF}`;c.textAlign='center';c.fillText(o.brand.toUpperCase(),x,y-w*.82,w*.85)}
}
const Wp2=()=>cv.width/2;

/* ---------- input ---------- */
function down(e){if(R)R.sw={x:e.clientX,y:e.clientY,t:performance.now(),used:false}}
function move(e){const s=R&&R.sw;if(!s||s.used)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(Math.hypot(dx,dy)>24){s.used=true;act(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'up':'down'))}}
function up(e){const s=R&&R.sw;if(s&&!s.used&&performance.now()-s.t<350){const w=innerWidth;act(s.x<w*.3?'left':s.x>w*.7?'right':'up')}if(R)R.sw=null}
function key(e){const m={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',Space:'up',ArrowDown:'down',KeyS:'down'}[e.code];if(m){e.preventDefault();if(!e.repeat)act(m)}}

function card(zi){
  N.showHud(false);G.state='card';G.mode='a3';R=null;
  const z=Z[zi];
  N.screen(`<div class="card"><span class="eyebrow">Akt 3 · Stage-Gate</span><h2>${z.name}</h2><p>${z.flavor}</p>
    <div class="row"><canvas data-p="${zi===0?'seer':zi===3?'caesar':zi===4?'colleague':'neck'}" width="32" height="32"></canvas></div>
    <ul class="how"><li>Swipe til siderne for at skifte spor</li><li>Swipe op for at hoppe, ned for at dukke dig</li><li>Swipe op under en gylden krog for at svinge</li><li>Saml hjælperne op på banen</li></ul>
    <p class="rec">${fmt(G.score)} point</p><div class="btns"><button class="px main" data-act="a3go">Videre</button></div></div>`);
  N.ACT.a3go=()=>{N.hideScreen();begin(zi,{fresh:true})};
}

N.a3={
  start(zi,endless){G.mode='a3';if(!G.stats||!G.stats.t0)G.stats=N.freshStats();if(endless){N.hideScreen();R=null;begin(0,{endless:true})}else card(zi||0)},
  update,render,idle(dt){if(R)fx(dt)},
  down,move,up,key,
  restart(){if(R)begin(R.endless?0:R.zi,{skip:true,endless:R.endless})},
  name:i=>Z[i]?Z[i].name:'',
  _R:()=>R,
};
})();
